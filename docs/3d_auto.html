<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wolfy Coordinates Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: auto;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: none;
        }
        canvas {
            display: block;
            border-radius: 8px;
            background-color: white;
            margin-left: 250px;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #content {
            position: absolute;
            background: white;
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            width: 200px;
            overflow: auto;
            left: 9px;
            top: 9px;
            height: 100px;
        }
        #controls {
            position: absolute;
            left: 10px;
            top: 130px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            width: 200px;
            max-height: calc(100vh - 175px);
            overflow-y: auto;
            z-index: 100;
            transition: all 0.3s ease;
        }
        #content p { margin: 0; line-height: 1.6; font-size: 12px; }
        #content button { width: 100%; padding: 5px 0; }
        #username { font-weight: bold; color: #E66D22; font-size: 15px; }
        #useremail { color: #7f8c8d; }
        #logintime { font-style: italic; color: #95a5a6; }

            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .control-group:last-child { border-bottom: none; }
        .control-group h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-row {
            display: flex;
            margin-bottom: 8px;
            align-items: center;
        }
        .control-row label { width: 30px; font-size: 13px; color: #666; font-weight: bold; }

            flex: 1;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

            background: #E66D22;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;

        .image-selector { margin-top: 10px; }
        .image-selector label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        .image-preview {
            width: 100%;
            height: 80px;
            background-color: #eee;
            margin-top: 5px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px dashed #ccc;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-input-button {
            background: #E66D22;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            text-align: center;
            display: block;

        .file-input-button:hover { background: #3a5a9f; }

        #fullscreenToggle {
            position: absolute;
            right: 10px;
            top: 0;
            z-index: 101;
            background: #E66D22;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .dimension-control { margin-top: 10px; }
        .dimension-control input { width: 70px; margin-right: 10px; }
        #exportData { background: #E66D22; width: 100%; padding: 10px; margin-top: 0; }

        /* ── MULTI SURFACE PANEL ── */
        #surfacePanel {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 10px;
            overflow: hidden;
        }

            border-right: 1px solid #e0e0e0;

            align-items: center;
            gap: 4px;

            color: #555;
            border-radius: 0;
            margin: 0;

        .surface-tab:hover { background: #e8e8e8; color: #333; }
        .surface-tab.active { background: #E66D22; color: white; }

        .surface-name-row input {

            padding: 4px 8px;

            border-radius: 4px;

        .surface-visibility-btn {

        .modal-overlay {

            justify-content: center;

            margin-bottom: 12px;

    <script>
       window.addEventListener('message', async function(event) {

            if(event.data.type !== 'LOAD_3D_DATA'){
                return;
            }

            const data = event.data.data;

            await load3DScene(data);

        });
        const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
        if (!isLoggedIn && false) {
            window.location.href = 'login';
        } else {
            document.body.style.display = 'block';
            document.getElementById('username').textContent = sessionStorage.getItem('name');
            document.getElementById('useremail').textContent = sessionStorage.getItem('email');
            document.getElementById('logintime').textContent = sessionStorage.getItem('loginTime');
        }
        function logout() {
            sessionStorage.clear();
            window.location.href = 'login';
        }
    </script>

    <script>
    // ════════════════════════════════════════════
    //   TILE GENERATOR LOGIC (standalone, no jQuery)
    // ════════════════════════════════════════════
$(document).ready(function () {
    let tileGenTargetSurface = null; // which surface to apply generated tile to
    window.currentItemId = '';
    async function load3DScene(data){

        // Set camera values
        window.currentItemId = data._id;
        $('#canvasWInput').val(data.RoomSize.width);
        $('#canvasHInput').val(data.RoomSize.height);

        $('#fovInput').val(data.CameraSetting.FOV);
        $('#nearInput').val(data.CameraSetting.Near);
        $('#farInput').val(data.CameraSetting.Far);
        $('#cameraZInput').val(data.CameraSetting.CameraZ);

        // Start ThreeJS
        $('#startThreeJS').click();

        // Wait for camera initialization
        const waitForCamera = setInterval(() => {
            if (!window.camera) {
                return;
            }

            clearInterval(waitForCamera);
            // Clear old surfaces
            window._surfaces = [];

            // Create surfaces from JSON
            data.RoomCoordinate.forEach(coord => {
                const surface = makeSurface(coord.name);

                surface.carvingPass = coord.carvingPass;
                surface.curve = Number(coord.curve) || 0;
                surface.curveAxis = coord.curveAxis === 'height' ? 'height' : 'width';
                surface.bendFrom = coord.bendFrom == null ? 0 : Number(coord.bendFrom);
                surface.bendTo = coord.bendTo == null ? 1 : Number(coord.bendTo);
                surface.shape = coord.shape && coord.shape.depth ? {
                    cols: coord.shape.cols, rows: coord.shape.rows, depth: coord.shape.depth.slice()
                } : null;
                surface.gridWidth = coord.width;
                surface.gridHeight = coord.height;

                surface.position.set(
                    coord.position.x,
                    coord.position.y,
                    coord.position.z
                );

                surface.rotation.set(
                    coord.rotation.x,
                    coord.rotation.y,
                    coord.rotation.z
                );

                surface.scale.set(
                    coord.scale.x,
                    coord.scale.y,
                    coord.scale.z
                );

                surface.visH =
                    2 * Math.tan((75 * Math.PI) / 360) *
                    window.camera.position.z;

                surface.visW =
                    surface.visH *
                    (surface.gridWidth / surface.gridHeight);

                window._surfaces.push(surface);

            });

            // Select first surface
            window._activeSurfaceIndex = 0;

            // Build UI
            window.buildSurfaceUI();

            // Create default tile texture
            window._surfaces.forEach(surface => {
                const params = {
                    surfW: surface.gridWidth,
                    surfH: surface.gridHeight,
                    tileW: 1200,
                    tileH: 600,
                    grout: 2,
                    groutColor: '#888888',
                    tileColor: '#e8e0d0'
                };

                const fullCanvas =
                    renderTileFullRes(params);

                const img = new Image();

                img.onload = () => {

                    surface.tileImageEl = img;

                    window.loadTileMesh(
                        surface,
                        img
                    );

                };

                img.src =
                    fullCanvas.toDataURL();
            });

            // Load master image
            if(data.Master && data.Master.length){

                const masterImg = new Image();

                masterImg.crossOrigin = 'anonymous';

                masterImg.onload = () => {

                    window._globalMaster.imageEl = masterImg;

                    window._surfaces.forEach(surface => {

                        window.loadMasterMesh(
                            surface,
                            masterImg
                        );

                    });

                };

                masterImg.src = data.Master[0];

            }

        }, 100);

    }
    window.load3DScene = load3DScene;
});
    function makeSurface(name) {
        return {
            name,
            visible: true,
            tileImageFile: null, tileImageEl: null, tileFileName: 'No file',
            tileMesh: null, masterMesh: null,
            gridWidth: 3000, gridHeight: 2400,
            visW: null, visH: null,   // per-surface plane geometry size (set on Update Dimensions)
            position: new THREE.Vector3(0,0,0),
            rotation: new THREE.Euler(0,0,0),
            scale:    new THREE.Vector3(1,1,1),
            // bent surface: degrees of arc (0 = flat), across 'width' or 'height'
            curve: 0, curveAxis: 'width', bendFrom: 0, bendTo: 1,
            // free shape: null or { cols, rows, depth[] }
            shape: null,
        };
    }

    // ── SURFACE SHAPE ───────────────────────────
    // Same code as the user panel render (shared/curved-plane.ts,
    // surfaceGeometry): flat, bent (whole or part), and / or a free shape.
    //  curve     degrees of arc of the bent part (0 = no bend);
    //            + the bent part goes back, - it comes forward
    //  curveAxis 'width' (left / right: wall, column) | 'height' (arch)
    //  bendFrom / bendTo  part that bends, 0-1 (0 = left / bottom)
    //  shape     { cols, rows, depth[] } points (row 0 = top) pushed
    //            forward (+) / back (-)
    function clampN(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function freeShape(shape) {
        const cols = Math.round(Number(shape && shape.cols));
        const rows = Math.round(Number(shape && shape.rows));
        const depth = shape && shape.depth;
        if (!(cols >= 2 && cols <= 9 && rows >= 2 && rows <= 9)) return null;
        if (!Array.isArray(depth) || depth.length !== cols * rows) return null;
        const values = depth.map(d => Number(d) || 0);
        return values.some(d => d !== 0) ? { cols, rows, depth: values } : null;
    }
    function spline(p0, p1, p2, p3, t) {
        return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t
            + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
    }
    function depthAt(shape, u, v) {
        const cols = shape.cols, rows = shape.rows, depth = shape.depth;
        const at = (r, c) => depth[clampN(r, 0, rows - 1) * cols + clampN(c, 0, cols - 1)];
        const fx = u * (cols - 1), fy = v * (rows - 1);
        const c = Math.min(cols - 2, Math.floor(fx)), r = Math.min(rows - 2, Math.floor(fy));
        const tx = fx - c, ty = fy - r;
        const row = rr => spline(at(rr, c - 1), at(rr, c), at(rr, c + 1), at(rr, c + 2), tx);
        return spline(row(r - 1), row(r), row(r + 1), row(r + 2), ty);
    }
    function surfaceGeometry(width, height, opts) {
        opts = opts || {};
        const deg = clampN(Number(opts.curve) || 0, -359, 359);
        const alongWidth = opts.curveAxis !== 'height';
        let from = clampN(Number(opts.bendFrom == null ? 0 : opts.bendFrom) || 0, 0, 1);
        let to = clampN(Number(opts.bendTo == null ? 1 : opts.bendTo), 0, 1);
        if (Number.isNaN(to)) to = 1;
        if (to < from) { const t = from; from = to; to = t; }
        const bent = Math.abs(deg) >= 0.01 && to - from > 0.001;
        const shape = freeShape(opts.shape);
        if (!bent && !shape) return new THREE.PlaneGeometry(width, height);

        const length = alongWidth ? width : height;
        let along = bent ? clampN(Math.ceil(Math.abs(deg) / 2 / (to - from)), 8, 400) : 1;
        let across = 1;
        if (shape) { along = Math.max(along, 48); across = 48; }
        const geo = new THREE.PlaneGeometry(width, height,
            alongWidth ? along : across, alongWidth ? across : along);
        const pos = geo.attributes.position;

        let path = [];
        const STEPS = 2000;
        if (bent) {
            const theta = Math.abs(deg) * Math.PI / 180;
            const sign = deg > 0 ? 1 : -1;
            const part = s => clampN((s / length - from) / (to - from), 0, 1);
            const mid = part(length / 2);
            const heading = s => sign * theta * (part(s) - mid);
            const ds = length / STEPS;
            path = [{ a: 0, z: 0 }];
            for (let k = 0; k < STEPS; k++) {
                const h0 = heading(k * ds), h1 = heading((k + 1) * ds);
                const dh = h1 - h0;
                const chord = Math.abs(dh) > 1e-9 ? ds * Math.sin(dh / 2) / (dh / 2) : ds;
                const hm = (h0 + h1) / 2;
                path.push({ a: path[k].a + chord * Math.cos(hm), z: path[k].z - chord * Math.sin(hm) });
            }
            const m = path[STEPS / 2];
            path = path.map(p => ({ a: p.a - m.a, z: p.z - m.z }));
        }
        const pathAt = s => {
            const f = clampN(s / length, 0, 1) * STEPS;
            const k = Math.min(STEPS - 1, Math.floor(f)), t = f - k;
            return { a: path[k].a + (path[k + 1].a - path[k].a) * t, z: path[k].z + (path[k + 1].z - path[k].z) * t };
        };
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), y = pos.getY(i);
            let z = 0;
            if (bent) {
                const p = pathAt((alongWidth ? x : y) + length / 2);
                if (alongWidth) pos.setX(i, p.a); else pos.setY(i, p.a);
                z = p.z;
            }
            if (shape) z += depthAt(shape, x / width + 0.5, 0.5 - y / height);
            pos.setZ(i, z);
        }
        pos.needsUpdate = true;
        geo.computeVertexNormals();
        return geo;
    }

    function renderTilePreview(outputCanvas) {
        const surfW  = parseFloat(document.getElementById('tg_surfaceW').value) || 3600;
        const surfH  = parseFloat(document.getElementById('tg_surfaceH').value) || 2400;
        const tileW  = parseFloat(document.getElementById('tg_tileW').value)  || 600;
        const tileH  = parseFloat(document.getElementById('tg_tileH').value)  || 300;
        const grout  = parseFloat(document.getElementById('tg_groutSize').value) || 5;
        const groutColor = document.getElementById('tg_groutColorHex').value || '#888888';
        const tileColor  = document.getElementById('tg_tileColorHex').value  || '#e8e0d0';

        // Scale so preview fits inside canvas width
        const previewW = outputCanvas.width;
        const scale = previewW / surfW;
        const previewH = Math.round(surfH * scale);
        outputCanvas.height = previewH;

        const ctx = outputCanvas.getContext('2d');
        ctx.clearRect(0, 0, previewW, previewH);

        // grout background
        ctx.fillStyle = groutColor;
        ctx.fillRect(0, 0, previewW, previewH);

        const scaledTileW  = tileW  * scale;
        const scaledTileH  = tileH  * scale;
        const scaledGrout  = Math.max(0.5, grout * scale);

        const halfGrout = scaledGrout / 2;

        // draw tiles
        ctx.fillStyle = tileColor;
        for (let y = 0; y < surfH; y += tileH + grout) {
            for (let x = 0; x < surfW; x += tileW + grout) {
                const sx = x * scale + halfGrout;
                const sy = y * scale + halfGrout;
                const sw = scaledTileW - scaledGrout;
                const sh = scaledTileH - scaledGrout;
                if (sw > 0 && sh > 0) {
                    ctx.fillRect(sx, sy, sw, sh);
                }
            }
        }
        return { surfW, surfH, tileW, tileH, grout, groutColor, tileColor };
    }

    function renderTileFullRes(params) {
        // Render at full resolution (1px per mm, capped for performance)
        const { surfW, surfH, tileW, tileH, grout, groutColor, tileColor } = params;
        const MAX = 4096;
        const scaleX = Math.min(1, MAX / surfW);
        const scaleY = Math.min(1, MAX / surfH);
        const sc = Math.min(scaleX, scaleY);

        const cw = Math.round(surfW * sc);
        const ch = Math.round(surfH * sc);

        const offscreen = document.createElement('canvas');
        offscreen.width  = cw;
        offscreen.height = ch;
        const ctx = offscreen.getContext('2d');

        ctx.fillStyle = groutColor;
        ctx.fillRect(0, 0, cw, ch);

        const scaledTileW = tileW * sc;
        const scaledTileH = tileH * sc;
        const scaledGrout = Math.max(0.5, grout * sc);
        const halfGrout   = scaledGrout / 2;

        ctx.fillStyle = tileColor;
        for (let y = 0; y < surfH; y += tileH + grout) {
            for (let x = 0; x < surfW; x += tileW + grout) {
                const sx = x * sc + halfGrout;
                const sy = y * sc + halfGrout;
                const sw = scaledTileW - scaledGrout;
                const sh = scaledTileH - scaledGrout;
                if (sw > 0 && sh > 0) ctx.fillRect(sx, sy, sw, sh);
            }
        }
        return offscreen;
    }

    function openTileGenerator(surfaceIndex) {
        tileGenTargetSurface = surfaceIndex;
        // Auto-sync Surface Width/Height from this surface's Grid Dimensions
        if (window._surfaces && window._surfaces[surfaceIndex]) {
            const surf = window._surfaces[surfaceIndex];
            document.getElementById('tg_surfaceW').value = surf.gridWidth;
            document.getElementById('tg_surfaceH').value = surf.gridHeight;
        }
        document.getElementById('tileGeneratorModal').classList.add('active');
        renderTilePreview(document.getElementById('tilePreviewCanvas'));
    }

    function closeTileGenerator() {
        document.getElementById('tileGeneratorModal').classList.remove('active');
    }

    // color pickers ↔ hex inputs sync
    function syncColorInputs(pickerId, hexId) {
        const picker = document.getElementById(pickerId);
        const hex    = document.getElementById(hexId);
        picker.addEventListener('input', () => { hex.value = picker.value; });
        hex.addEventListener('input', () => {
            if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) picker.value = hex.value;
        });
    }
    syncColorInputs('tg_groutColorPicker', 'tg_groutColorHex');
    syncColorInputs('tg_tileColorPicker',  'tg_tileColorHex');

    document.getElementById('tg_previewBtn').addEventListener('click', () => {
        renderTilePreview(document.getElementById('tilePreviewCanvas'));
    });

    document.getElementById('tg_cancelBtn').addEventListener('click', closeTileGenerator);

    document.getElementById('tg_exportBtn').addEventListener('click', () => {
        const previewCanvas = document.getElementById('tilePreviewCanvas');
        const params = renderTilePreview(previewCanvas);

        // generate full-res
        const fullCanvas = renderTileFullRes(params);

        // download PNG
        fullCanvas.toBlob(blob => {
            const url  = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href     = url;
            link.download = 'tile_surface.png';
            // link.click();
            URL.revokeObjectURL(url);

        // Also load it into the target surface as tile image
            if (tileGenTargetSurface !== null && window._surfaces) {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    const surf = window._surfaces[tileGenTargetSurface];
                    if (surf) {
                        // sync grid dimensions from tile generator surface size
                        surf.gridWidth  = params.surfW;
                        surf.gridHeight = params.surfH;
                        surf.tileImageFile = blob;
                        surf.tileImageEl   = img;
                        surf.tileFileName  = 'tile_surface.png';
                        // Update sidebar displays
                        const fnEl = document.getElementById('tileFileName_' + tileGenTargetSurface);
                        if (fnEl) fnEl.textContent = 'tile_surface.png';
                        const prevEl = document.getElementById('tileImagePreview_' + tileGenTargetSurface);
                        if (prevEl) prevEl.style.backgroundImage = 'url(' + url + ')';
                        const gwEl = document.getElementById('gridWidth_'  + tileGenTargetSurface);
                        const ghEl = document.getElementById('gridHeight_' + tileGenTargetSurface);
                        if (gwEl) gwEl.value = surf.gridWidth;
                        if (ghEl) ghEl.value = surf.gridHeight;
                        // Reload 3D mesh
                        loadTileMesh(surf, img);
                    }
                };
                img.src = URL.createObjectURL(blob);
            }
        }, 'image/png');

        closeTileGenerator();
    });

            $('#startThreeJS').on('click', function () {
                const defaultFOV     = parseFloat($('#fovInput').val()) || 75;
                const defaultNear    = parseFloat($('#nearInput').val()) || 0.1;
                const defaultFar     = parseFloat($('#farInput').val()) || 1000;
                const defaultCameraZ = parseFloat($('#cameraZInput').val()) || 5;
                const defaultCanvasW = parseFloat($('#canvasWInput').val()) || 4000;
                const defaultCanvasH = parseFloat($('#canvasHInput').val()) || 2667;

                $('#cameraConfigModal').hide();

                initThree(
                    defaultFOV,
                    defaultNear,
                    defaultFar,
                    defaultCameraZ,
                    defaultCanvasW,
                    defaultCanvasH
                );

                if(window._surfaces.length){
                   window.buildSurfaceUI();
                }

            });

            function initThree(fov, near, far, camZ, canvasRefW, canvasRefH) {
                scene = new THREE.Scene();
                window.scene = scene;
                scene.background = new THREE.Color(0xffffff);

                const ar = canvasRefW / canvasRefH;
                const canvasW = window.innerWidth * 0.8;
                const canvasH = canvasW / ar;

                camera = new THREE.PerspectiveCamera(
                    fov,
                    canvasW / canvasH,
                    near,
                    far
                );
                camera.position.z = camZ;

                window.camera = camera;

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setClearColor(0xffffff, 0);
                renderer.setSize(canvasW, canvasH);
                renderer.setPixelRatio(window.devicePixelRatio);
                document.body.appendChild(renderer.domElement);

                // Match production loadTiles exactly:
                // visibleHeight = 2 * tan((75 * PI) / 360) * camera.position.z  ← hardcoded 75
                // visibleWidth  = visibleHeight * (coord.width / coord.height)   ← per-surface grid aspect
                const PLANE_FOV  = 75;
                window._surfaces.forEach(surf => {
                    surf.visH = 2 * Math.tan((PLANE_FOV * Math.PI) / 360) * camZ;
                    surf.visW = surf.visH * (surf.gridWidth / surf.gridHeight);
                });

                // z-axis line
                const zGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,5)]);
                scene.add(new THREE.Line(zGeo, new THREE.LineBasicMaterial({ color: 0x0000ff })));

                function animate() {
                    requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                }
                animate();

                // expose reload helper
                window._reloadActiveSurface = function () {
                    const idx = window._activeSurfaceIndex;
                    const surf = window._surfaces[idx];
                    if (!surf) return;
                    if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl);
                    if (window._globalMaster.imageEl) window.loadMasterMesh(surf, window._globalMaster.imageEl);
                };

                setupGlobalControls();
            }

            // ── LOAD TILE MESH — uses per-surface visW/visH ──
            function loadTileMesh(surf, image) {
                if (surf.tileMesh) { scene.remove(surf.tileMesh); surf.tileMesh = null; }
                if (!surf.visible) return;

                const tex = new THREE.Texture(image);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.generateMipmaps = true;
                tex.needsUpdate = true;
                tex.minFilter = THREE.NearestFilter;
                tex.magFilter = THREE.NearestFilter;

                const geo = surfaceGeometry(surf.visW, surf.visH, surf);
                const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 1, side: THREE.DoubleSide });

                if (!surf.visible) return;

                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;

                // production: camera.fov + camera.position.z + camera.aspect (= canvasW/canvasH = canvasRefW/canvasRefH)
                const visH = 2 * Math.tan((camera.fov * Math.PI) / 360) * camera.position.z;
                const visW = visH * camera.aspect;

                        <button type="button" data-from="50" data-to="100" style="padding:2px 6px;font-size:11px;">${surf.curveAxis === 'height' ? 'Top' : 'Right'} half</button>
                        <button type="button" data-from="0" data-to="25" style="padding:2px 6px;font-size:11px;">${surf.curveAxis === 'height' ? 'Bottom' : 'Left'} edge</button>
                        <button type="button" data-from="75" data-to="100" style="padding:2px 6px;font-size:11px;">${surf.curveAxis === 'height' ? 'Top' : 'Right'} edge</button>
                    </div>

                    <div style="font-size:12px;color:#555;margin-top:12px;margin-bottom:5px;font-weight:bold;">Free shape <span style="font-weight:normal;color:#999;">(push points: + forward, − back)</span></div>
                    <div class="control-row">
                        <label style="width:45px;">Points:</label>
                        <select id="shapeSize_${window._activeSurfaceIndex}" style="width:80px;">
                            <option value="0" ${!surf.shape ? 'selected' : ''}>off</option>
                            ${[3, 4, 5, 7].map(n => `<option value="${n}" ${surf.shape && surf.shape.cols === n ? 'selected' : ''}>${n} × ${n}</option>`).join('')}
                        </select>
                    </div>
                    <div id="shapeGrid_${window._activeSurfaceIndex}" style="display:grid;gap:2px;"></div>
                    <div id="shapeTools_${window._activeSurfaceIndex}" style="display:none;gap:4px;margin-top:4px;">
                        <label style="font-size:11px;">Step <input type="number" id="shapeStep_${window._activeSurfaceIndex}" value="0.1" step="0.05" min="0.01" style="width:50px;"></label>
                        <button type="button" id="shapeReset_${window._activeSurfaceIndex}" style="padding:2px 6px;font-size:11px;">Flat</button>
                    </div>

                    <button id="updateImages_${window._activeSurfaceIndex}" style="margin-top:10px;width:100%;">Apply Tile Image</button>
                `;
                body.appendChild(tileSection);

                // wire file inputs
                const idx = window._activeSurfaceIndex;
                document.getElementById('tileImageInput_' + idx).addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    surf.tileImageFile = file;
                    surf.tileFileName  = file.name;
                    document.getElementById('tileFileName_' + idx).textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.getElementById('tileImagePreview_' + idx).style.backgroundImage = 'url(' + ev.target.result + ')';
                        surf._tilePreviewUrl = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                // per-surface Update Dimensions — matches production loadTiles: fov=75 hardcoded, actual camZ, grid aspect
                document.getElementById('updateDimensions_' + idx).addEventListener('click', function() {
                    surf.gridWidth  = parseFloat(document.getElementById('gridWidth_'  + idx).value) || surf.gridWidth;
                    surf.gridHeight = parseFloat(document.getElementById('gridHeight_' + idx).value) || surf.gridHeight;
                    surf.visH = 2 * Math.tan((75 * Math.PI) / 360) * camera.position.z;
                    surf.visW = surf.visH * (surf.gridWidth / surf.gridHeight);
                    if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl);
                });

                // Curve: redraw live while the angle / axis changes
                const curveInput = document.getElementById('curve_' + idx);
                const curveRange = document.getElementById('curveRange_' + idx);
                const curveAxis  = document.getElementById('curveAxis_' + idx);
                const applyCurve = (value) => {
                    const v = Math.max(-359, Math.min(359, parseFloat(value) || 0));
                    surf.curve = v;
                    curveInput.value = v;
                    curveRange.value = Math.max(-180, Math.min(180, v));
                    if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl);
                };
                curveInput.addEventListener('input', () => applyCurve(curveInput.value));
                curveRange.addEventListener('input', () => applyCurve(curveRange.value));
                curveAxis.addEventListener('change', () => {
                    surf.curveAxis = curveAxis.value === 'height' ? 'height' : 'width';
                    if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl);
                    window.buildSurfaceUI(); // labels: left / right or bottom / top
                });

                // Bent part (0-100 %) and quick presets
                const bendFromEl = document.getElementById('bendFrom_' + idx);
                const bendToEl   = document.getElementById('bendTo_' + idx);
                const applyPart = () => {
                    surf.bendFrom = clampN((parseFloat(bendFromEl.value) || 0) / 100, 0, 1);
                    const to = parseFloat(bendToEl.value);
                    surf.bendTo = clampN(Number.isFinite(to) ? to / 100 : 1, 0, 1);
                    if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl);
                };
                bendFromEl.addEventListener('input', applyPart);
                bendToEl.addEventListener('input', applyPart);
                document.querySelectorAll('#bendPresets_' + idx + ' button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        bendFromEl.value = btn.dataset.from;
                        bendToEl.value = btn.dataset.to;
                        applyPart();
                    });
                });

                // Free shape: a grid of inputs laid out like the surface
                // (top row = top of the surface); click a box and use the
                // arrow keys to push it by "Step"
                const shapeSize = document.getElementById('shapeSize_' + idx);
                const shapeGrid = document.getElementById('shapeGrid_' + idx);
                const shapeTools = document.getElementById('shapeTools_' + idx);
                const redrawShape = () => { if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl); };
                const drawGrid = () => {
                    shapeGrid.innerHTML = '';
                    shapeTools.style.display = surf.shape ? 'flex' : 'none';
                    if (!surf.shape) return;
                    shapeGrid.style.gridTemplateColumns = `repeat(${surf.shape.cols}, 1fr)`;
                    surf.shape.depth.forEach((d, k) => {
                        const box = document.createElement('input');
                        box.type = 'number';
                        box.value = d;
                        box.step = document.getElementById('shapeStep_' + idx).value || '0.1';
                        box.title = 'Row ' + (Math.floor(k / surf.shape.cols) + 1) + ', point ' + (k % surf.shape.cols + 1) + ' (+ forward, − back)';
                        box.style.cssText = 'width:100%;min-width:0;padding:2px;font-size:11px;text-align:center;';
                        const paint = () => { const v = Number(box.value) || 0; box.style.background = v > 0 ? '#ffe9d9' : v < 0 ? '#dfeaff' : '#fff'; };
                        paint();
                        box.addEventListener('input', () => {
                            surf.shape.depth[k] = Number(box.value) || 0;
                            paint();
                            redrawShape();
                        });
                        shapeGrid.appendChild(box);
                    });
                };
                shapeSize.addEventListener('change', () => {
                    const n = parseInt(shapeSize.value) || 0;
                    surf.shape = n ? { cols: n, rows: n, depth: new Array(n * n).fill(0) } : null;
                    drawGrid();
                    redrawShape();
                });
                document.getElementById('shapeStep_' + idx).addEventListener('change', drawGrid);
                document.getElementById('shapeReset_' + idx).addEventListener('click', () => {
                    if (!surf.shape) return;
                    surf.shape.depth = surf.shape.depth.map(() => 0);
                    drawGrid();
                    redrawShape();
                });
                drawGrid();

                // Apply tile image button
                document.getElementById('updateImages_' + idx).addEventListener('click', function() {
                    if (surf.tileImageFile) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const img = new Image();
                            img.crossOrigin = "anonymous";
                            img.onload = () => { surf.tileImageEl = img; loadTileMesh(surf, img); };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(surf.tileImageFile);
                    } else if (surf.tileImageEl) {
                        loadTileMesh(surf, surf.tileImageEl);
                    } else {
                        alert('Please select a tile image first.');
                    }
                });

                // sync transform controls from surface
                writeControlsFromSurface(surf);
            }
            window.buildSurfaceUI = buildSurfaceUI;
            function switchSurface(idx) {
                // save current before switching
                readControlsToSurface();
                window._activeSurfaceIndex = idx;
                window.buildSurfaceUI();
            }

            function removeSurface(idx) {
                const surf = window._surfaces[idx];
                if (surf.tileMesh)   scene.remove(surf.tileMesh);
                if (surf.masterMesh) scene.remove(surf.masterMesh);
                window._surfaces.splice(idx, 1);
                if (window._activeSurfaceIndex >= window._surfaces.length) {
                    window._activeSurfaceIndex = window._surfaces.length - 1;
                }
                window.buildSurfaceUI();
            }

            function toggleSurfaceVisibility(surf) {
                if (surf.visible) {
                    // show
                    if (surf.tileImageEl)   loadTileMesh(surf, surf.tileImageEl);
                    if (window._globalMaster.imageEl) window.loadMasterMesh(surf, window._globalMaster.imageEl);
                } else {
                    // hide
                    if (surf.tileMesh)   { scene.remove(surf.tileMesh);   surf.tileMesh   = null; }
                    if (surf.masterMesh) { scene.remove(surf.masterMesh); surf.masterMesh = null; }
                }
            }

            // ── ADD SURFACE BUTTON ────────────────────
            document.getElementById('addSurfaceBtn').addEventListener('click', () => {
                const num = window._surfaces.length + 1;
                const newSurf = makeSurface('Surface ' + num);
                newSurf.visH = 2 * Math.tan((75 * Math.PI) / 360) * camera.position.z;
                newSurf.visW = newSurf.visH * (newSurf.gridWidth / newSurf.gridHeight);
                window._surfaces.push(newSurf);
                window._activeSurfaceIndex = window._surfaces.length - 1;
                window.buildSurfaceUI();
            });

            // ── GLOBAL CONTROLS ──────────────────────
            function setupGlobalControls() {
                $('#posX,#posY,#posZ,#rotX,#rotY,#rotZ,#scaleX,#scaleY,#scaleZ,#opacity').on('input change', function() {
                    readControlsToSurface();
                });

                // ── GLOBAL MASTER IMAGE ──
                document.getElementById('masterImageInput_global').addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    window._globalMaster.file = file;
                    window._globalMaster.fileName = file.name;
                    document.getElementById('masterFileName_global').textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.getElementById('masterImagePreview_global').style.backgroundImage = 'url(' + ev.target.result + ')';
                        window._globalMaster.previewUrl = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                document.getElementById('updateMasterImage_global').addEventListener('click', function() {
                    if (!window._globalMaster.file && !window._globalMaster.imageEl) {
                        alert('Please select a master image first.');
                        return;
                    }
                    if (window._globalMaster.file) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const img = new Image();
                            img.crossOrigin = "anonymous";
                            img.onload = () => {
                                window._globalMaster.imageEl = img;
                                // apply to all surfaces
                                window._surfaces.forEach(surf => window.loadMasterMesh(surf, img));
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(window._globalMaster.file);
                    } else {
                        window._surfaces.forEach(surf => window.loadMasterMesh(surf, window._globalMaster.imageEl));
                    }
                });

                $('#decimalPrecision').on('change', function() {
                    decimalPrecision = parseInt($(this).val()) || 4;
                    const step = '0.' + '0'.repeat(decimalPrecision - 1) + '1';
                    $('#posX,#posY,#posZ,#rotX,#rotY,#rotZ,#scaleX,#scaleY,#scaleZ').attr('step', step);
                    const surf = window._surfaces[window._activeSurfaceIndex];
                    if (surf) writeControlsFromSurface(surf);
                });

                $('#exportData').on('click', function() {
                    const exportObj = {
                        timestamp: new Date().toISOString(),
                        masterImage: window._globalMaster.fileName || 'none',
                        masterOpacity: window._globalMaster.opacity.toFixed(2),
                        surfaces: window._surfaces.map((surf, i) => ({
                            index: i,
                            name: surf.name,
                            visible: surf.visible,
                            gridWidth: surf.gridWidth,
                            gridHeight: surf.gridHeight,
                            position: {
                                x: surf.position.x.toFixed(decimalPrecision),
                                y: surf.position.y.toFixed(decimalPrecision),
                                z: surf.position.z.toFixed(decimalPrecision),
                            },
                            rotation: {
                                x: surf.rotation.x.toFixed(decimalPrecision),
                                y: surf.rotation.y.toFixed(decimalPrecision),
                                z: surf.rotation.z.toFixed(decimalPrecision),
                            },
                            scale: {
                                x: surf.scale.x.toFixed(decimalPrecision),
                                y: surf.scale.y.toFixed(decimalPrecision),
                                z: surf.scale.z.toFixed(decimalPrecision),
                            },
                            curve: surf.curve || 0,
                            curveAxis: surf.curveAxis || 'width',
                            bendFrom: surf.bendFrom ?? 0,
                            bendTo: surf.bendTo ?? 1,
                            shape: freeShape(surf.shape),
                            tileImage: surf.tileFileName || 'none',
                        })),
                    };
                    const dataStr = JSON.stringify(exportObj, null, 2);
                    const uri  = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
                    const link = document.createElement('a');
                    link.setAttribute('href', uri);
                    link.setAttribute('download', 'coordinates.json');
                    link.click();
                });
                $('#saveCoordinates').on('click', function () {

                    if (!confirm('Are you sure you want to save coordinates?')) {
                        return;
                    }

                    const roomCoordinate = window._surfaces.map(surf => ({

                        name: surf.name,
                        carvingPass: surf.carvingPass,
                        position: {
                            x: Number(surf.position.x),
                            y: Number(surf.position.y),
                            z: Number(surf.position.z)
                        },

                        rotation: {
                            x: Number(surf.rotation.x),
                            y: Number(surf.rotation.y),
                            z: Number(surf.rotation.z)
                        },

                        scale: {
                            x: Number(surf.scale.x),
                            y: Number(surf.scale.y),
                            z: Number(surf.scale.z)
                        },

                        width: Number(surf.gridWidth),
                        height: Number(surf.gridHeight),
                        curve: Number(surf.curve) || 0,
                        curveAxis: surf.curveAxis === 'height' ? 'height' : 'width',
                        bendFrom: surf.bendFrom == null ? 0 : Number(surf.bendFrom),
                        bendTo: surf.bendTo == null ? 1 : Number(surf.bendTo),
                        shape: freeShape(surf.shape)

                    }));

                    window.opener.postMessage({
                        type: 'SAVE_ROOM_COORDINATE',
                        itemId:window.currentItemId,
                        RoomCoordinate: roomCoordinate
                    }, 'https://admin.wolfynext.com');

                    alert('Coordinates Saved Successfully');

                });
                $('#fullscreenToggle').on('click', function() {
                    if (!document.fullscreenElement) {
                        renderer.domElement.requestFullscreen().catch(err => alert('Fullscreen error: ' + err.message));
                    } else {
                        document.exitFullscreen();
                    }
                });
            }
        });
    })(jQuery);
    </script>
</body>
</html>
