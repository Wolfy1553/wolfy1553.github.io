<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wolfy Coordinates Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: auto;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: none;
        }
        canvas {
            display: block;
            border-radius: 8px;
            background-color: white;
            margin-left: 250px;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #content {
            position: absolute;
            background: white;
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            width: 200px;
            overflow: auto;
            left: 9px;
            top: 9px;
            height: 100px;
        }
        #controls {
            position: absolute;
            left: 10px;
            top: 130px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            width: 200px;
            max-height: calc(100vh - 175px);
            overflow-y: auto;
            z-index: 100;
            transition: all 0.3s ease;
        }
        #content p { margin: 0; line-height: 1.6; font-size: 12px; }
        #content button { width: 100%; padding: 5px 0; }
        #username { font-weight: bold; color: #E66D22; font-size: 15px; }
        #useremail { color: #7f8c8d; }
        #logintime { font-style: italic; color: #95a5a6; }
        .control-group {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .control-group:last-child { border-bottom: none; }
        .control-group h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-row {
            display: flex;
            margin-bottom: 8px;
            align-items: center;
        }
        .control-row label { width: 30px; font-size: 13px; color: #666; font-weight: bold; }
        .control-row input, .control-row select {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .control-row input[type="number"] { width: 80px; }
        button {
            background: #E66D22;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:hover { background: #3a5a9f; }
        .image-selector { margin-top: 10px; }
        .image-selector label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        .image-preview {
            width: 100%;
            height: 80px;
            background-color: #eee;
            margin-top: 5px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px dashed #ccc;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-input-button {
            background: #E66D22;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;

            font-size: 13px;
            width: 100%;
            text-align: center;

    <script>
        const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
        if (!isLoggedIn && false) {
            window.location.href = 'login';
        } else {
            document.body.style.display = 'block';
            document.getElementById('username').textContent = sessionStorage.getItem('name');
            document.getElementById('useremail').textContent = sessionStorage.getItem('email');
            document.getElementById('logintime').textContent = sessionStorage.getItem('loginTime');
        }
        function logout() {
            sessionStorage.clear();
            window.location.href = 'login';

    <script>
    // ════════════════════════════════════════════
    //   TILE GENERATOR LOGIC (standalone, no jQuery)
    // ════════════════════════════════════════════

    let tileGenTargetSurface = null; // which surface to apply generated tile to

    function renderTilePreview(outputCanvas) {
        const surfW  = parseFloat(document.getElementById('tg_surfaceW').value) || 3600;
        const surfH  = parseFloat(document.getElementById('tg_surfaceH').value) || 2400;
        const tileW  = parseFloat(document.getElementById('tg_tileW').value)  || 600;
        const tileH  = parseFloat(document.getElementById('tg_tileH').value)  || 300;
        const grout  = parseFloat(document.getElementById('tg_groutSize').value) || 5;
        const groutColor = document.getElementById('tg_groutColorHex').value || '#888888';
        const tileColor  = document.getElementById('tg_tileColorHex').value  || '#e8e0d0';

        // Scale so preview fits inside canvas width
        const previewW = outputCanvas.width;
        const scale = previewW / surfW;
        const previewH = Math.round(surfH * scale);
        outputCanvas.height = previewH;

        const ctx = outputCanvas.getContext('2d');
        ctx.clearRect(0, 0, previewW, previewH);

        // grout background
        ctx.fillStyle = groutColor;
        ctx.fillRect(0, 0, previewW, previewH);

        const scaledTileW  = tileW  * scale;
        const scaledTileH  = tileH  * scale;
        const scaledGrout  = Math.max(0.5, grout * scale);

        const halfGrout = scaledGrout / 2;

        // draw tiles
        ctx.fillStyle = tileColor;
        for (let y = 0; y < surfH; y += tileH + grout) {
            for (let x = 0; x < surfW; x += tileW + grout) {
                const sx = x * scale + halfGrout;
                const sy = y * scale + halfGrout;
                const sw = scaledTileW - scaledGrout;
                const sh = scaledTileH - scaledGrout;
                if (sw > 0 && sh > 0) {
                    ctx.fillRect(sx, sy, sw, sh);
                }
            }
        }
        return { surfW, surfH, tileW, tileH, grout, groutColor, tileColor };
    }

    function renderTileFullRes(params) {
        // Render at full resolution (1px per mm, capped for performance)
        const { surfW, surfH, tileW, tileH, grout, groutColor, tileColor } = params;
        const MAX = 4096;
        const scaleX = Math.min(1, MAX / surfW);
        const scaleY = Math.min(1, MAX / surfH);
        const sc = Math.min(scaleX, scaleY);

        const cw = Math.round(surfW * sc);
        const ch = Math.round(surfH * sc);

        const offscreen = document.createElement('canvas');
        offscreen.width  = cw;
        offscreen.height = ch;
        const ctx = offscreen.getContext('2d');

        ctx.fillStyle = groutColor;
        ctx.fillRect(0, 0, cw, ch);

        const scaledTileW = tileW * sc;
        const scaledTileH = tileH * sc;
        const scaledGrout = Math.max(0.5, grout * sc);
        const halfGrout   = scaledGrout / 2;

        ctx.fillStyle = tileColor;
        for (let y = 0; y < surfH; y += tileH + grout) {
            for (let x = 0; x < surfW; x += tileW + grout) {
                const sx = x * sc + halfGrout;
                const sy = y * sc + halfGrout;
                const sw = scaledTileW - scaledGrout;
                const sh = scaledTileH - scaledGrout;
                if (sw > 0 && sh > 0) ctx.fillRect(sx, sy, sw, sh);
            }
        }
        return offscreen;
    }

    function openTileGenerator(surfaceIndex) {
        tileGenTargetSurface = surfaceIndex;
        // Auto-sync Surface Width/Height from this surface's Grid Dimensions
        if (window._surfaces && window._surfaces[surfaceIndex]) {
            const surf = window._surfaces[surfaceIndex];
            document.getElementById('tg_surfaceW').value = surf.gridWidth;
            document.getElementById('tg_surfaceH').value = surf.gridHeight;
        }
        document.getElementById('tileGeneratorModal').classList.add('active');
        renderTilePreview(document.getElementById('tilePreviewCanvas'));
    }

    function closeTileGenerator() {
        document.getElementById('tileGeneratorModal').classList.remove('active');
    }

    // color pickers ↔ hex inputs sync
    function syncColorInputs(pickerId, hexId) {
        const picker = document.getElementById(pickerId);
        const hex    = document.getElementById(hexId);
        picker.addEventListener('input', () => { hex.value = picker.value; });
        hex.addEventListener('input', () => {
            if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) picker.value = hex.value;
        });
    }
    syncColorInputs('tg_groutColorPicker', 'tg_groutColorHex');
    syncColorInputs('tg_tileColorPicker',  'tg_tileColorHex');

    document.getElementById('tg_previewBtn').addEventListener('click', () => {
        renderTilePreview(document.getElementById('tilePreviewCanvas'));
    });

    document.getElementById('tg_cancelBtn').addEventListener('click', closeTileGenerator);

    document.getElementById('tg_exportBtn').addEventListener('click', () => {
        const previewCanvas = document.getElementById('tilePreviewCanvas');
        const params = renderTilePreview(previewCanvas);

        // generate full-res
        const fullCanvas = renderTileFullRes(params);

        // download PNG
        fullCanvas.toBlob(blob => {
            const url  = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href     = url;
            link.download = 'tile_surface.png';
            // link.click();
            URL.revokeObjectURL(url);

        // Also load it into the target surface as tile image
            if (tileGenTargetSurface !== null && window._surfaces) {
                const img = new Image();
                img.onload = () => {
                    const surf = window._surfaces[tileGenTargetSurface];
                    if (surf) {
                        // sync grid dimensions from tile generator surface size
                        surf.gridWidth  = params.surfW;
                        surf.gridHeight = params.surfH;
                        surf.tileImageFile = blob;
                        surf.tileImageEl   = img;
                        surf.tileFileName  = 'tile_surface.png';
                        // Update sidebar displays
                        const fnEl = document.getElementById('tileFileName_' + tileGenTargetSurface);
                        if (fnEl) fnEl.textContent = 'tile_surface.png';
                        const prevEl = document.getElementById('tileImagePreview_' + tileGenTargetSurface);
                        if (prevEl) prevEl.style.backgroundImage = 'url(' + url + ')';
                        const gwEl = document.getElementById('gridWidth_'  + tileGenTargetSurface);
                        const ghEl = document.getElementById('gridHeight_' + tileGenTargetSurface);
                        if (gwEl) gwEl.value = surf.gridWidth;
                        if (ghEl) ghEl.value = surf.gridHeight;
                        // Reload 3D mesh
                        loadTileMesh(surf, img);
                    }
                };
                img.src = URL.createObjectURL(blob);
            }
        }, 'image/png');

        closeTileGenerator();
    });
    </script>

    <script>
    // ════════════════════════════════════════════
    //   THREE.JS + MULTI-SURFACE ENGINE
    // ════════════════════════════════════════════
    (function($) {
        $(document).ready(function () {

            // ── SURFACE DATA STORE ──────────────────
            // Each surface: { name, visible, tileImageFile, tileImageEl, tileFileName,
            //                 tileMesh, masterMesh, gridWidth, gridHeight,
            //                 position, rotation, scale, opacity }
            // Master image is GLOBAL (shared across all surfaces)
            window._surfaces = [];
            window._activeSurfaceIndex = 0;
            window._globalMaster = { file: null, imageEl: null, fileName: 'No file', previewUrl: null, opacity: 1 };

            function makeSurface(name) {
                return {
                    name,
                    visible: true,
                    tileImageFile: null, tileImageEl: null, tileFileName: 'No file',
                    tileMesh: null, masterMesh: null,
                    gridWidth: 3000, gridHeight: 2400,
                    position: new THREE.Vector3(0,0,0),
                    rotation: new THREE.Euler(0,0,0),
                    scale:    new THREE.Vector3(1,1,1),
                };
            }

            // start with two default surfaces
            window._surfaces.push(makeSurface('Floor'));
            window._surfaces.push(makeSurface('Wall'));

            // ── THREE.JS INIT ────────────────────────
            let scene, camera, renderer;
            let decimalPrecision = 4;

            $('#startThreeJS').on('click', function () {
                const defaultFOV     = parseFloat($('#fovInput').val())     || 75;
                const defaultNear    = parseFloat($('#nearInput').val())    || 0.1;
                const defaultFar     = parseFloat($('#farInput').val())     || 1000;
                const defaultCameraZ = parseFloat($('#cameraZInput').val()) || 5;
                const defaultCanvasW = parseFloat($('#canvasWInput').val()) || 4000;
                const defaultCanvasH = parseFloat($('#canvasHInput').val()) || 2667;
                $('#cameraConfigModal').hide();
                initThree(defaultFOV, defaultNear, defaultFar, defaultCameraZ, defaultCanvasW, defaultCanvasH);
                buildSurfaceUI();
            });

            function initThree(fov, near, far, camZ, canvasRefW, canvasRefH) {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xffffff);

                const ar = canvasRefW / canvasRefH;
                const canvasW = window.innerWidth * 0.8;
                const canvasH = canvasW / ar;

                camera = new THREE.PerspectiveCamera(fov, canvasW / canvasH, near, far);
                camera.position.z = camZ;

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setClearColor(0xffffff, 0);
                renderer.setSize(canvasW, canvasH);
                renderer.setPixelRatio(window.devicePixelRatio);
                document.body.appendChild(renderer.domElement);

                // Initial fixed visible size — uses camera.aspect exactly like the original code
                // visibleHeight2 = 2 * tan(fov/2) * camZ  (original line)
                // visibleWidth2 = visibleHeight2 * camera.aspect  (original line)
                _fixedVisH = 2 * Math.tan((fov * Math.PI) / 360) * camZ;
                _fixedVisW = _fixedVisH * camera.aspect;

                // z-axis line
                const zGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,5)]);
                scene.add(new THREE.Line(zGeo, new THREE.LineBasicMaterial({ color: 0x0000ff })));

                function animate() {
                    requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                }
                animate();

                // expose reload helper
                window._reloadActiveSurface = function () {
                    const idx = window._activeSurfaceIndex;
                    const surf = window._surfaces[idx];
                    if (!surf) return;
                    if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl);
                    if (window._globalMaster.imageEl) loadMasterMesh(surf, window._globalMaster.imageEl);
                };

                setupGlobalControls();
            }

            // ── FIXED VISIBLE SIZE (based on canvas, preserves coordinate space) ──
            // This must match original: Width=4000, Height=2667 aspect ratio
            // gridWidth/gridHeight are ONLY used for tile generator image size, NOT for plane geometry
            let _fixedVisW, _fixedVisH;

            // ── LOAD TILE MESH (always uses fixed canvas visible size — preserves coordinates) ──
            function loadTileMesh(surf, image) {
                if (surf.tileMesh) { scene.remove(surf.tileMesh); surf.tileMesh = null; }
                if (!surf.visible) return;

                const tex = new THREE.Texture(image);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.generateMipmaps = true;
                tex.needsUpdate = true;
                tex.minFilter = THREE.NearestFilter;
                tex.magFilter = THREE.NearestFilter;

                const geo = new THREE.PlaneGeometry(_fixedVisW, _fixedVisH);
                // tile mesh opacity is always 1 — opacity control is for master image only
                const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 1, side: THREE.DoubleSide });
                surf.tileMesh = new THREE.Mesh(geo, mat);
                applyTransformToMesh(surf, surf.tileMesh);
                scene.add(surf.tileMesh);
            }

            // ── LOAD MASTER MESH (opacity controlled by global Opacity slider) ──
            function loadMasterMesh(surf, image) {
                if (surf.masterMesh) { scene.remove(surf.masterMesh); surf.masterMesh = null; }
                if (!surf.visible) return;

                const tex = new THREE.Texture(image);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;

                const visH = 2 * Math.tan((camera.fov * Math.PI) / 360) * camera.position.z;
                const visW = visH * camera.aspect;
                const geo  = new THREE.PlaneGeometry(visW, visH);
                const mat  = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: window._globalMaster.opacity, side: THREE.DoubleSide });
                surf.masterMesh = new THREE.Mesh(geo, mat);
                scene.add(surf.masterMesh);
            }

            // ── APPLY GLOBAL MASTER OPACITY TO ALL MASTER MESHES ──
            function applyMasterOpacity(opacity) {
                window._globalMaster.opacity = opacity;
                window._surfaces.forEach(surf => {
                    if (surf.masterMesh) {
                        surf.masterMesh.material.opacity = opacity;
                        surf.masterMesh.material.needsUpdate = true;
                    }
                });
            }

            // ── RELOAD TILE MESH WITH CORRECT DIMENSIONS ──
            function reloadSurfaceWithDimensions(surf) {
                const _aspect = surf.gridWidth / surf.gridHeight;
                _fixedVisH = 2 * Math.tan((camera.fov * Math.PI) / 360) * camera.position.z;
                _fixedVisW = _fixedVisH * _aspect;
                if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl);
            }

            function applyTransformToMesh(surf, mesh) {
                if (!mesh) return;
                mesh.position.copy(surf.position);
                mesh.rotation.copy(surf.rotation);
                mesh.scale.copy(surf.scale);
            }

            // ── READ CONTROLS → ACTIVE SURFACE ───────
            function readControlsToSurface() {
                const surf = window._surfaces[window._activeSurfaceIndex];
                if (!surf) return;

                surf.position.x = parseFloat($('#posX').val()) || 0;
                surf.position.y = parseFloat($('#posY').val()) || 0;
                surf.position.z = parseFloat($('#posZ').val()) || 0;
                surf.rotation.x = parseFloat($('#rotX').val()) || 0;
                surf.rotation.y = parseFloat($('#rotY').val()) || 0;
                surf.rotation.z = parseFloat($('#rotZ').val()) || 0;
                surf.scale.x    = parseFloat($('#scaleX').val()) || 1;
                surf.scale.y    = parseFloat($('#scaleY').val()) || 1;
                surf.scale.z    = parseFloat($('#scaleZ').val()) || 1;

                applyTransformToMesh(surf, surf.tileMesh);

                // opacity is global — applies to master image across all surfaces
                const opVal = Math.max(0, Math.min(1, parseFloat($('#opacity').val()) || 1));
                applyMasterOpacity(opVal);
            }

            function writeControlsFromSurface(surf) {
                const p = surf.position, r = surf.rotation, s = surf.scale;
                $('#posX').val(p.x.toFixed(decimalPrecision));
                $('#posY').val(p.y.toFixed(decimalPrecision));
                $('#posZ').val(p.z.toFixed(decimalPrecision));
                $('#rotX').val(r.x.toFixed(decimalPrecision));
                $('#rotY').val(r.y.toFixed(decimalPrecision));
                $('#rotZ').val(r.z.toFixed(decimalPrecision));
                $('#scaleX').val(s.x.toFixed(decimalPrecision));
                $('#scaleY').val(s.y.toFixed(decimalPrecision));
                $('#scaleZ').val(s.z.toFixed(decimalPrecision));
                $('#opacity').val(window._globalMaster.opacity.toFixed(2));
            }

            // ── SURFACE TAB UI ────────────────────────
            function buildSurfaceUI() {
                const tabBar = document.getElementById('surfaceTabBar');
                const body   = document.getElementById('surfaceBody');

                // rebuild tabs
                // remove old tabs (keep the + button)
                const addBtn = document.getElementById('addSurfaceBtn');
                while (tabBar.firstChild && tabBar.firstChild !== addBtn) {
                    tabBar.removeChild(tabBar.firstChild);
                }

                window._surfaces.forEach((surf, i) => {
                    const tab = document.createElement('button');
                    tab.className = 'surface-tab' + (i === window._activeSurfaceIndex ? ' active' : '');
                    tab.dataset.index = i;

                    const label = document.createElement('span');
                    label.textContent = surf.name;
                    tab.appendChild(label);

                    if (window._surfaces.length > 1) {
                        const rm = document.createElement('button');
                        rm.className = 'remove-surface';
                        rm.title = 'Remove surface';
                        rm.textContent = '×';
                        rm.addEventListener('click', (e) => {
                            e.stopPropagation();
                            removeSurface(i);
                        });
                        tab.appendChild(rm);
                    }

                    tab.addEventListener('click', () => switchSurface(i));
                    tabBar.insertBefore(tab, addBtn);
                });

                // rebuild body for active surface
                const surf = window._surfaces[window._activeSurfaceIndex];
                body.innerHTML = '';

                // name row
                const nameRow = document.createElement('div');
                nameRow.className = 'surface-name-row';
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = surf.name;
                nameInput.addEventListener('input', () => {
                    surf.name = nameInput.value;
                    buildSurfaceUI(); // refresh tabs
                });
                nameRow.appendChild(nameInput);

                const visBtn = document.createElement('button');
                visBtn.className = 'surface-visibility-btn' + (surf.visible ? '' : ' hidden-surface');
                visBtn.textContent = surf.visible ? 'Visible' : 'Hidden';
                visBtn.addEventListener('click', () => {
                    surf.visible = !surf.visible;
                    toggleSurfaceVisibility(surf);
                    buildSurfaceUI();
                });
                nameRow.appendChild(visBtn);
                body.appendChild(nameRow);

                // tile image + grid dimensions section
                const tileSection = document.createElement('div');
                tileSection.innerHTML = `
                    <div style="font-size:12px;color:#555;margin-bottom:5px;font-weight:bold;">Tile Image</div>
                    <div class="tile-action-buttons">
                        <button id="chooseTileBtn_${window._activeSurfaceIndex}" onclick="document.getElementById('tileImageInput_${window._activeSurfaceIndex}').click()">Choose File</button>
                        <button onclick="openTileGenerator(${window._activeSurfaceIndex})">Create Surface</button>
                    </div>
                    <input type="file" id="tileImageInput_${window._activeSurfaceIndex}" accept="image/*" style="display:none;">
                    <div class="file-name" id="tileFileName_${window._activeSurfaceIndex}">${surf.tileFileName || 'No file'}</div>
                    <div class="image-preview" id="tileImagePreview_${window._activeSurfaceIndex}" style="background-image:${surf.tileImageEl ? 'url('+surf._tilePreviewUrl+')' : 'none'}"></div>

                    <div style="font-size:12px;color:#555;margin-top:12px;margin-bottom:5px;font-weight:bold;">Grid Dimensions</div>
                    <div class="control-row">
                        <label style="width:45px;">Width:</label>
                        <input type="number" id="gridWidth_${window._activeSurfaceIndex}" value="${surf.gridWidth}" step="1" style="width:70px;">
                    </div>
                    <div class="control-row">
                        <label style="width:45px;">Height:</label>
                        <input type="number" id="gridHeight_${window._activeSurfaceIndex}" value="${surf.gridHeight}" step="1" style="width:70px;">
                    </div>
                    <button id="updateDimensions_${window._activeSurfaceIndex}" style="margin-top:6px;width:100%;">Update Dimensions</button>

                    <button id="updateImages_${window._activeSurfaceIndex}" style="margin-top:10px;width:100%;">Apply Tile Image</button>
                `;
                body.appendChild(tileSection);

                // wire file inputs
                const idx = window._activeSurfaceIndex;
                document.getElementById('tileImageInput_' + idx).addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    surf.tileImageFile = file;
                    surf.tileFileName  = file.name;
                    document.getElementById('tileFileName_' + idx).textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.getElementById('tileImagePreview_' + idx).style.backgroundImage = 'url(' + ev.target.result + ')';
                        surf._tilePreviewUrl = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                // per-surface Update Dimensions — recalculates plane visible size (same as original updateDimensions)
                document.getElementById('updateDimensions_' + idx).addEventListener('click', function() {
                    surf.gridWidth  = parseFloat(document.getElementById('gridWidth_'  + idx).value) || surf.gridWidth;
                    surf.gridHeight = parseFloat(document.getElementById('gridHeight_' + idx).value) || surf.gridHeight;
                    // Recalculate _fixedVisW/H using grid aspect ratio — same formula as original code
                    const _aspect = surf.gridWidth / surf.gridHeight;
                    _fixedVisH = 2 * Math.tan((camera.fov * Math.PI) / 360) * camera.position.z;
                    _fixedVisW = _fixedVisH * _aspect;
                    // Reload tile mesh with new plane geometry
                    if (surf.tileImageEl) loadTileMesh(surf, surf.tileImageEl);
                });

                // Apply tile image button
                document.getElementById('updateImages_' + idx).addEventListener('click', function() {
                    if (surf.tileImageFile) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const img = new Image();
                            img.onload = () => { surf.tileImageEl = img; loadTileMesh(surf, img); };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(surf.tileImageFile);
                    } else if (surf.tileImageEl) {
                        loadTileMesh(surf, surf.tileImageEl);
                    } else {
                        alert('Please select a tile image first.');
                    }
                });

                // sync transform controls from surface
                writeControlsFromSurface(surf);
            }

            function switchSurface(idx) {
                // save current before switching
                readControlsToSurface();
                window._activeSurfaceIndex = idx;
                buildSurfaceUI();
            }

            function removeSurface(idx) {
                const surf = window._surfaces[idx];
                if (surf.tileMesh)   scene.remove(surf.tileMesh);
                if (surf.masterMesh) scene.remove(surf.masterMesh);
                window._surfaces.splice(idx, 1);
                if (window._activeSurfaceIndex >= window._surfaces.length) {
                    window._activeSurfaceIndex = window._surfaces.length - 1;
                }
                buildSurfaceUI();
            }

            function toggleSurfaceVisibility(surf) {
                if (surf.visible) {
                    // show
                    if (surf.tileImageEl)   loadTileMesh(surf, surf.tileImageEl);
                    if (window._globalMaster.imageEl) loadMasterMesh(surf, window._globalMaster.imageEl);
                } else {
                    // hide
                    if (surf.tileMesh)   { scene.remove(surf.tileMesh);   surf.tileMesh   = null; }
                    if (surf.masterMesh) { scene.remove(surf.masterMesh); surf.masterMesh = null; }
                }
            }

            // ── ADD SURFACE BUTTON ────────────────────
            document.getElementById('addSurfaceBtn').addEventListener('click', () => {
                const num = window._surfaces.length + 1;
                window._surfaces.push(makeSurface('Surface ' + num));
                window._activeSurfaceIndex = window._surfaces.length - 1;
                buildSurfaceUI();
            });

            // ── GLOBAL CONTROLS ──────────────────────
            function setupGlobalControls() {
                $('#posX,#posY,#posZ,#rotX,#rotY,#rotZ,#scaleX,#scaleY,#scaleZ,#opacity').on('input change', function() {
                    readControlsToSurface();
                });

                // ── GLOBAL MASTER IMAGE ──
                document.getElementById('masterImageInput_global').addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    window._globalMaster.file = file;
                    window._globalMaster.fileName = file.name;
                    document.getElementById('masterFileName_global').textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.getElementById('masterImagePreview_global').style.backgroundImage = 'url(' + ev.target.result + ')';
                        window._globalMaster.previewUrl = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                document.getElementById('updateMasterImage_global').addEventListener('click', function() {
                    if (!window._globalMaster.file && !window._globalMaster.imageEl) {
                        alert('Please select a master image first.');
                        return;
                    }
                    if (window._globalMaster.file) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const img = new Image();
                            img.onload = () => {
                                window._globalMaster.imageEl = img;
                                // apply to all surfaces
                                window._surfaces.forEach(surf => loadMasterMesh(surf, img));
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(window._globalMaster.file);
                    } else {
                        window._surfaces.forEach(surf => loadMasterMesh(surf, window._globalMaster.imageEl));
                    }
                });

                $('#decimalPrecision').on('change', function() {
                    decimalPrecision = parseInt($(this).val()) || 4;
                    const step = '0.' + '0'.repeat(decimalPrecision - 1) + '1';
                    $('#posX,#posY,#posZ,#rotX,#rotY,#rotZ,#scaleX,#scaleY,#scaleZ').attr('step', step);
                    const surf = window._surfaces[window._activeSurfaceIndex];
                    if (surf) writeControlsFromSurface(surf);
                });

                $('#exportData').on('click', function() {
                    const exportObj = {
                        timestamp: new Date().toISOString(),
                        masterImage: window._globalMaster.fileName || 'none',
                        masterOpacity: window._globalMaster.opacity.toFixed(2),
                        surfaces: window._surfaces.map((surf, i) => ({
                            index: i,
                            name: surf.name,
                            visible: surf.visible,
                            gridWidth: surf.gridWidth,
                            gridHeight: surf.gridHeight,
                            position: {
                                x: surf.position.x.toFixed(decimalPrecision),
                                y: surf.position.y.toFixed(decimalPrecision),
                                z: surf.position.z.toFixed(decimalPrecision),
                            },
                            rotation: {
                                x: surf.rotation.x.toFixed(decimalPrecision),
                                y: surf.rotation.y.toFixed(decimalPrecision),
                                z: surf.rotation.z.toFixed(decimalPrecision),
                            },
                            scale: {
                                x: surf.scale.x.toFixed(decimalPrecision),
                                y: surf.scale.y.toFixed(decimalPrecision),
                                z: surf.scale.z.toFixed(decimalPrecision),
                            },
                            tileImage: surf.tileFileName || 'none',
                        })),
                    };
                    const dataStr = JSON.stringify(exportObj, null, 2);
                    const uri  = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
                    const link = document.createElement('a');
                    link.setAttribute('href', uri);
                    link.setAttribute('download', 'coordinates.json');
                    link.click();
                });

                $('#fullscreenToggle').on('click', function() {
                    if (!document.fullscreenElement) {
                        renderer.domElement.requestFullscreen().catch(err => alert('Fullscreen error: ' + err.message));
                    } else {
                        document.exitFullscreen();
                    }
                });
            }
        });
    })(jQuery);
    </script>
</body>
