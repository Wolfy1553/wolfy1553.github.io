<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>360 Coordinate Editor</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  overflow:hidden;
  background:#111;
  color:white;
}

#app{
  display:flex;
  width:100vw;
  height:100vh;
}

#viewer{
  width:82%;
  height:100%;
  background:black;
}

#sidebar{
  width:18%;
  height:100%;
  overflow:auto;
  background:#1e1e1e;
  padding:15px;
}

.group{
  margin-bottom:12px;
}

.group label{
  display:block;
  margin-bottom:5px;
  font-size:12px;
}

.group input{
  width:100%;
  padding:8px;
  border:none;
  border-radius:4px;
  background:#2d2d2d;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:4px;
  background:#0b84ff;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#006fe0;
}

#jsonOutput{
  margin-top:20px;
  background:#111;
  padding:10px;
  border-radius:4px;
  font-size:11px;
  color:#00ff90;
  white-space:pre-wrap;
}

</style>
</head>
<body>

<div id="app">

  <div id="viewer"></div>

  <div id="sidebar">

    <div class="group">
      <label>Upload 6 Cube PNG</label>
      <input type="file" id="cubeUpload" accept="image/*">
    </div>

    <div class="group">
      <label>Surface Width</label>
      <input type="number" id="surfaceWidth" value="3000">
    </div>

    <div class="group">
      <label>Surface Height</label>
      <input type="number" id="surfaceHeight" value="3000">
    </div>

    <div class="group">
      <label>Tile Width</label>
      <input type="number" id="tileWidth" value="1200">
    </div>

    <div class="group">
      <label>Tile Height</label>
      <input type="number" id="tileHeight" value="600">
    </div>

    <div class="group">
      <label>Position X</label>
      <input type="number" step="0.01" id="posX" value="0">
    </div>

    <div class="group">
      <label>Position Y</label>
      <input type="number" step="0.01" id="posY" value="0">
    </div>

    <div class="group">
      <label>Position Z</label>
      <input type="number" step="0.01" id="posZ" value="-5">
    </div>

    <div class="group">
      <label>Rotation X</label>
      <input type="number" id="rotX" value="0">
    </div>

    <div class="group">
      <label>Rotation Y</label>
      <input type="number" id="rotY" value="0">
    </div>

    <div class="group">
      <label>Rotation Z</label>
      <input type="number" id="rotZ" value="0">
    </div>

    <button id="updateBtn">Update Wall</button>

    <button id="copyBtn">Copy JSON</button>

    <div id="jsonOutput"></div>

  </div>

</div>

<script src="jquery-3.6.0.min.js"></script>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>

<script>

const viewer = document.getElementById('viewer');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  viewer.clientWidth / viewer.clientHeight,
  0.1,
  1000
);

camera.position.set(0,0,0.1);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  viewer.clientWidth,
  viewer.clientHeight
);

viewer.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableZoom = false;
controls.enablePan = false;
controls.enableDamping = true;
controls.rotateSpeed = -0.5;

scene.add(
  new THREE.AmbientLight(0xffffff,1)
);

let cubeMesh = null;
let wallMesh = null;

function createCubeEnvironment(url){

  const image = new Image();

  image.onload = function(){

    const faceSize = image.height;

    const faceMap = [
      // { x: faceSize, y: 0 },
      // { x: faceSize * 3, y: 0 },
      // { x: faceSize * 2, y: 0 },
      // { x: 0, y: 0 },
      // { x: faceSize * 4, y: 0 },
      // { x: faceSize * 5, y: 0 },
       { x: faceSize, y: 0 }, // Right
      { x: faceSize * 3, y: 0 }, // Left
      { x: faceSize * 4, y: 0 }, // Top
      { x: faceSize * 5, y: 0 }, // Bottom
      { x: 0, y: 0 }, // Front
      { x: faceSize * 2, y: 0 }, // Back
    ];

    const materials = [];

    for(let i=0;i<6;i++){

      const canvas = document.createElement('canvas');

      canvas.width = faceSize;
      canvas.height = faceSize;

      const ctx = canvas.getContext('2d');

      const pos = faceMap[i];

      ctx.drawImage(
        image,
        pos.x,
        pos.y,
        faceSize,
        faceSize,
        0,
        0,
        faceSize,
        faceSize
      );

      const texture =
        new THREE.CanvasTexture(canvas);

      texture.needsUpdate = true;

      materials.push(
        new THREE.MeshBasicMaterial({
          map:texture,
          side:THREE.BackSide
        })
      );
    }

    if(cubeMesh){

      scene.remove(cubeMesh);
    }

    cubeMesh = new THREE.Mesh(
      new THREE.BoxGeometry(20,20,20),
      materials
    );

    scene.add(cubeMesh);

    console.log('360 Loaded');
  };

  image.src = url;
}

function createWall(){

  if(wallMesh){

    scene.remove(wallMesh);
  }

  const surfaceWidth =
    Number($('#surfaceWidth').val());

  const surfaceHeight =
    Number($('#surfaceHeight').val());

  const tileWidth =
    Number($('#tileWidth').val());

  const tileHeight =
    Number($('#tileHeight').val());

  const sceneWidth = surfaceWidth / 1000;
  const sceneHeight = surfaceHeight / 1000;

  const tileW = tileWidth / 1000;
  const tileH = tileHeight / 1000;

  const cols = Math.ceil(surfaceWidth / tileWidth);
  const rows = Math.ceil(surfaceHeight / tileHeight);

  const group = new THREE.Group();

  const bg = new THREE.Mesh(
    new THREE.PlaneGeometry(
      sceneWidth,
      sceneHeight
    ),
    new THREE.MeshBasicMaterial({
      color:0x444444,
      side:THREE.DoubleSide,
      transparent:true,
      opacity:0.5
    })
  );

  group.add(bg);

  for(let y=0;y<rows;y++){

    for(let x=0;x<cols;x++){

      const tile = new THREE.Mesh(
        new THREE.PlaneGeometry(
          tileW,
          tileH
        ),
        new THREE.MeshBasicMaterial({
          color:0xffffff,
          wireframe:true,
          side:THREE.DoubleSide
        })
      );

      tile.position.x =
        x * tileW - sceneWidth/2 + tileW/2;

      tile.position.y =
        y * tileH - sceneHeight/2 + tileH/2;

      tile.position.z = 0.001;

      group.add(tile);
    }
  }

  wallMesh = group;

  scene.add(wallMesh);

  updateWall();
}

function updateWall(){

  if(!wallMesh) return;

  wallMesh.position.set(
    Number($('#posX').val()),
    Number($('#posY').val()),
    Number($('#posZ').val())
  );

  wallMesh.rotation.set(
    THREE.Math.degToRad(
      Number($('#rotX').val())
    ),
    THREE.Math.degToRad(
      Number($('#rotY').val())
    ),
    THREE.Math.degToRad(
      Number($('#rotZ').val())
    )
  );

  updateJSON();
}

function updateJSON(){

  $('#jsonOutput').text(
    JSON.stringify({
      position:wallMesh.position,
      rotation:wallMesh.rotation
    },null,2)
  );
}

createWall();

$('#cubeUpload').on('change',function(e){

  const file = e.target.files[0];

  if(!file) return;

  const url = URL.createObjectURL(file);

  createCubeEnvironment(url);
});

$('#updateBtn').on('click',function(){

  createWall();
});

$('#copyBtn').on('click',function(){

  navigator.clipboard.writeText(
    $('#jsonOutput').text()
  );

  alert('Copied');
});

$('input').on('input',function(){

  updateWall();
});

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{

  camera.aspect =
    viewer.clientWidth /
    viewer.clientHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
  );
});

</script>

</body>
</html>
