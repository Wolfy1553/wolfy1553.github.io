<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>360 Coordinate Match Tool</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  overflow:hidden;
  background:#111;
  color:#fff;
}

#app{
  display:flex;
  width:100vw;
  height:100vh;
}

#viewer{
  width:82%;
  height:100%;
  background:#000;
}

#sidebar{
  width:18%;
  height:100%;
  overflow:auto;
  background:#1d1d1d;
  padding:15px;
}

.group{
  margin-bottom:12px;
}

.group label{
  display:block;
  margin-bottom:5px;
  font-size:12px;
}

.group input{
  width:100%;
  padding:8px;
  border:none;
  border-radius:4px;
  background:#2d2d2d;
  color:#fff;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:4px;
  background:#0b84ff;
  color:#fff;
  cursor:pointer;
}

button:hover{
  background:#006de0;
}

#jsonOutput{
  margin-top:20px;
  background:#111;
  padding:10px;
  border-radius:4px;
  color:#00ff90;
  font-size:11px;
  white-space:pre-wrap;
}

</style>
</head>

<body>

<div id="app">

  <div id="viewer"></div>

  <div id="sidebar">

    <div class="group">
      <label>Upload 6 Cube PNG</label>
      <input type="file" id="cubeUpload" accept="image/*">
    </div>

    <div class="group">
      <label>Surface Width</label>
      <input type="number" id="surfaceWidth" value="3000">
    </div>

    <div class="group">
      <label>Surface Height</label>
      <input type="number" id="surfaceHeight" value="3000">
    </div>

    <div class="group">
      <label>Tile Width</label>
      <input type="number" id="tileWidth" value="1200">
    </div>

    <div class="group">
      <label>Tile Height</label>
      <input type="number" id="tileHeight" value="600">
    </div>

    <div class="group">
      <label>Grout Size</label>
      <input type="number" step="0.001" id="groutSize" value="0.01">
    </div>

    <hr style="margin:15px 0;border-color:#333;">

    <div class="group">
      <label>Position X</label>
      <input type="number" step="0.01" id="posX" value="0">
    </div>

    <div class="group">
      <label>Position Y</label>
      <input type="number" step="0.01" id="posY" value="0">
    </div>

    <div class="group">
      <label>Position Z</label>
      <input type="number" step="0.01" id="posZ" value="0">
    </div>

    <div class="group">
      <label>Rotation X (Radians)</label>
      <input type="number" step="0.001" id="rotX" value="0">
    </div>

    <div class="group">
      <label>Rotation Y (Radians)</label>
      <input type="number" step="0.001" id="rotY" value="0">
    </div>

    <div class="group">
      <label>Rotation Z (Radians)</label>
      <input type="number" step="0.001" id="rotZ" value="0">
    </div>

    <div class="group">
      <label>Scale X</label>
      <input type="number" step="0.1" id="scaleX" value="1">
    </div>

    <div class="group">
      <label>Scale Y</label>
      <input type="number" step="0.1" id="scaleY" value="1">
    </div>

    <div class="group">
      <label>Scale Z</label>
      <input type="number" step="0.1" id="scaleZ" value="1">
    </div>

    <button id="updateBtn">
      Update Wall
    </button>

    <button id="copyBtn">
      Copy JSON
    </button>

    <div id="jsonOutput"></div>

  </div>

</div>

<script src="jquery-3.6.0.min.js"></script>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>

<script>

const viewer = document.getElementById('viewer');

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0,0,0.1);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  precision:'highp'
});

renderer.setClearColor(0xffffff,1);

renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

viewer.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableZoom = false;
controls.enablePan = false;
controls.enableRotate = true;
controls.rotateSpeed = -0.5;
controls.enableDamping = true;
controls.dampingFactor = 0.05;

camera.position.set(0,0,0.1);

controls.target.set(0,0,0);

scene.add(
  new THREE.AmbientLight(0xffffff,0.5)
);

const directionalLight =
  new THREE.DirectionalLight(0xffffff,1);

directionalLight.position.set(10,10,10);

scene.add(directionalLight);

let cubeMesh = null;
let wallMesh = null;

function createCubeEnvironment(url){

  const image = new Image();

  image.crossOrigin = 'anonymous';

  image.onload = ()=>{

    const faceSize = image.height;

    const faceMap = [
      { x: faceSize, y: 0 }, // Right
      { x: faceSize * 3, y: 0 }, // Left
      { x: faceSize * 4, y: 0 }, // Top
      { x: faceSize * 5, y: 0 }, // Bottom
      { x: 0, y: 0 }, // Front
      { x: faceSize * 2, y: 0 }, // Back
    ];

    const textures = [];

    for(let i=0;i<6;i++){

      const { x, y } = faceMap[i];

      const canvas =
        document.createElement('canvas');

      canvas.width = faceSize;
      canvas.height = faceSize;

      const ctx = canvas.getContext('2d');

      if(i === 2 || i === 3){

        ctx.translate(
          faceSize/2,
          faceSize/2
        );

        ctx.rotate(Math.PI);

        ctx.translate(
          -faceSize/2,
          -faceSize/2
        );
      }

      ctx.drawImage(
        image,
        x,
        y,
        faceSize,
        faceSize,
        0,
        0,
        faceSize,
        faceSize
      );

      const texture =
        new THREE.CanvasTexture(canvas);

      texture.minFilter =
        THREE.LinearMipMapLinearFilter;

      texture.magFilter =
        THREE.LinearFilter;

      texture.generateMipmaps = true;

      textures.push(texture);
    }

    if(cubeMesh){

      scene.remove(cubeMesh);
    }

    const materials = textures.map((tex)=>{

      return new THREE.MeshBasicMaterial({
        map:tex,
        transparent:true,
        opacity:1,
        side:THREE.BackSide
      });

    });

    cubeMesh = new THREE.Mesh(
      new THREE.BoxGeometry(20,20,20),
      materials
    );

    scene.add(cubeMesh);

  };

  image.src = url;
}

function createWall(){

  if(wallMesh){

    scene.remove(wallMesh);
  }

  const surfaceWidth =
    Number($('#surfaceWidth').val());

  const surfaceHeight =
    Number($('#surfaceHeight').val());

  const tileWidth =
    Number($('#tileWidth').val());

  const tileHeight =
    Number($('#tileHeight').val());

  const groutSize =
    Number($('#groutSize').val());

  // EXACT SAME AS LIVE MODULE

  const sceneWidth =
    surfaceWidth / 1000;

  const sceneHeight =
    (surfaceHeight / surfaceWidth)
    * sceneWidth;

  const tileWidth3D =
    (tileWidth / surfaceWidth)
    * sceneWidth;

  const tileHeight3D =
    (tileHeight / surfaceHeight)
    * sceneHeight;

  const tileCountX =
    Math.ceil(surfaceWidth / tileWidth);

  const tileCountY =
    Math.ceil(surfaceHeight / tileHeight);

  const tileGrid =
    new THREE.Group();

  // ==================================================
  // GROUT BACKGROUND
  // ==================================================

  const groutPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(
      sceneWidth,
      sceneHeight
    ),
    new THREE.MeshBasicMaterial({
      color:0x00ffcc,
      transparent:true,
      opacity:0.45,
      side:THREE.DoubleSide
    })
  );

  groutPlane.position.z = -0.0025;

  tileGrid.add(groutPlane);

  // ==================================================
  // OUTLINE
  // ==================================================

  const edges =
    new THREE.EdgesGeometry(
      groutPlane.geometry
    );

  const outline =
    new THREE.LineSegments(
      edges,
      new THREE.LineBasicMaterial({
        color:0xffff00
      })
    );

  tileGrid.add(outline);

  // ==================================================
  // TILES
  // ==================================================

  for(let row=0;row<tileCountY;row++){

    for(let col=0;col<tileCountX;col++){

      const tile = new THREE.Mesh(

        new THREE.PlaneGeometry(
          tileWidth3D,
          tileHeight3D
        ),

        new THREE.MeshBasicMaterial({
          color:0xff0000,
          transparent:true,
          opacity:0.9,
          side:THREE.DoubleSide
        })

      );

      // EXACT SAME AS LIVE MODULE

      tile.position.x =

        col * (tileWidth3D + groutSize)

        - sceneWidth / 2

        + tileWidth3D / 2;

      tile.position.y =

        row * (tileHeight3D + groutSize)

        - sceneHeight / 2

        + tileHeight3D / 2;

      tileGrid.add(tile);
    }
  }

  // ==================================================
  // LABEL
  // ==================================================

  const canvas =
    document.createElement('canvas');

  canvas.width = 256;
  canvas.height = 100;

  const ctx = canvas.getContext('2d');

  ctx.fillStyle =
    'rgba(255,255,255,0.6)';

//   roundRect(
//     ctx,
//     68,
//     30,
//     120,
//     40,
//     20
//   );

//   ctx.fill();

//   ctx.font = '700 25px Arial';

//   ctx.fillStyle = '#000';

//   ctx.textAlign = 'center';

//   ctx.textBaseline = 'middle';

//   ctx.fillText(
//     'WALL',
//     128,
//     50
//   );

  const tex =
    new THREE.CanvasTexture(canvas);

  const label =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        1.2,
        0.5
      ),

      new THREE.MeshBasicMaterial({
        map:tex,
        transparent:true,
      })

    );

  label.position.set(
    0,
    0,
    0.02
  );

  tileGrid.add(label);

  wallMesh = tileGrid;

  scene.add(wallMesh);

  updateWall();
}

function roundRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,
    y,
    x+w,
    y+r
  );

  ctx.lineTo(x+w,y+h-r);

  ctx.quadraticCurveTo(
    x+w,
    y+h,
    x+w-r,
    y+h
  );

  ctx.lineTo(x+r,y+h);

  ctx.quadraticCurveTo(
    x,
    y+h,
    x,
    y+h-r
  );

  ctx.lineTo(x,y+r);

  ctx.quadraticCurveTo(
    x,
    y,
    x+r,
    y
  );

  ctx.closePath();
}

function updateWall(){

  if(!wallMesh) return;

  // EXACT SAME AS LIVE MODULE

  wallMesh.position.set(

    Number($('#posX').val()),

    Number($('#posY').val()),

    Number($('#posZ').val())

  );

  wallMesh.rotation.set(

    Number($('#rotX').val()),

    Number($('#rotY').val()),

    Number($('#rotZ').val())

  );

  wallMesh.scale.set(

    Number($('#scaleX').val()),

    Number($('#scaleY').val()),

    Number($('#scaleZ').val())

  );

  updateJSON();
}

function updateJSON(){

  $('#jsonOutput').text(

JSON.stringify({

  position:{
    x:wallMesh.position.x,
    y:wallMesh.position.y,
    z:wallMesh.position.z
  },

  rotation:{
    x:wallMesh.rotation.x,
    y:wallMesh.rotation.y,
    z:wallMesh.rotation.z
  },

  scale:{
    x:wallMesh.scale.x,
    y:wallMesh.scale.y,
    z:wallMesh.scale.z
  }

},null,2)

  );
}

createWall();

$('#cubeUpload').on(
  'change',
  function(e){

    const file =
      e.target.files[0];

    if(!file) return;

    const url =
      URL.createObjectURL(file);

    createCubeEnvironment(url);
  }
);

$('#updateBtn').on(
  'click',
  function(){

    createWall();
  }
);

$('#copyBtn').on(
  'click',
  function(){

    navigator.clipboard.writeText(
      $('#jsonOutput').text()
    );

    alert('Copied');
  }
);

$('input').on(
  'input',
  function(){

    updateWall();
  }
);

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

</script>

</body>
</html>
