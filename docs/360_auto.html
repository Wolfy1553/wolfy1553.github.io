<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>360 Multi Surface Coordinate Tool</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  overflow:hidden;
  background:#111;
  color:#fff;
}

#app{
  display:flex;
  width:100vw;
  height:100vh;
}

#viewer{
  width:calc(100% - 280px);
  height:100%;
  background:#fff;
}

#sidebar{
  width:280px;
  min-width:280px;
  background:#F5F5F5;
  padding:14px;
  overflow-y:auto;
  border-left:1px solid #333;
}

.group{
  margin-bottom:10px;
}

.group label{
  display:block;
  margin-bottom:4px;
  font-size:13px;
  color:#262626;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.group input,
.group select{
  width:100%;
  height:38px;
  padding:0 12px;
  border-radius:8px;
  border:1px solid #2f2f2f;
  background:#ffffff;
  color:#000000;
  font-size:18px;
  font-weight:700;
}

.axis-label{
  display:flex !important;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.axis-label .axis-icon{
  font-size:22px;
}

.axis-hint{
  font-size:16px;
  font-weight:600;
  color:#8a8a8a;
  text-transform:none;
  letter-spacing:0;
  white-space:nowrap;
}

.surface-field{
  border-left:4px solid #ff0044 !important;
}

.position-field{
  border-left:4px solid #00b7ff !important;
}

.rotation-field{
  border-left:4px solid #ff9800 !important;
}

.scale-field{
  border-left:4px solid #00d26a !important;
}

button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
  background:#0b84ff;
  color:#fff;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

button:hover{
  background:#006de0;
}

.surface-item{
  padding:10px;
  background:#fff;
  border:2px solid #ddd;
  border-radius:8px;
  margin-bottom:8px;
  cursor:pointer;
  color:#111;
  font-size:13px;
  font-weight:bold;
}

.surface-item.active{
  border-color:#0b84ff;
  background:#e9f3ff;
}

#surfaceList{
  margin-top:10px;
}

#nameImage{
  font-size:16px;
  color:#006de0;
  margin-top:6px;
  display:block;
}

#jsonOutput{
  margin-top:20px;
  background:#111;
  padding:10px;
  border-radius:4px;
  color:#00ff90;
  font-size:11px;
  white-space:pre-wrap;
}

</style>
</head>

<body>

<div id="app">

  <div id="viewer"></div>

  <div id="sidebar">

    <div class="group">
      <label>Tile Width (mm)</label>
      <input type="number" id="tileWidth" value="1200">
    </div>

    <div class="group">
      <label>Tile Height (mm)</label>
      <input type="number" id="tileHeight" value="600">
    </div>

    <div class="group">
      <label>Grout Size</label>
      <input type="number" step="0.001" id="groutSize" value="0.01">
    </div>

    <div class="group">
      <label>Decimal Precision</label>

      <select id="decimalPrecision">
        <option value="1">1</option>
        <option value="0.1">0.1</option>
        <option value="0.01" selected>0.01</option>
        <option value="0.001">0.001</option>
        <option value="0.0001">0.0001</option>
      </select>
    </div>

    <div class="group">
      <label>Cube Opacity</label>

      <input
        type="range"
        id="cubeOpacity"
        min="0"
        max="1"
        step="0.1"
        value="1"
      >
    </div>

    <hr style="margin:15px 0;">

    <div class="group">
      <label>Upload 6 Cube PNG</label>
      <input type="file" id="cubeUpload" accept="image/*">
      <label id="nameImage"></label>
    </div>

    <div class="group">
      <label>Surface Type</label>

      <select id="surfaceType">
        <option value="wall">Wall</option>
        <option value="floor">Floor</option>
      </select>
    </div>

    <div class="group">
      <label>Surface Width (mm)</label>
      <input class="surface-field" type="number" id="surfaceWidth" value="4600">
    </div>

    <div class="group">
      <label>Surface Height (mm)</label>
      <input class="surface-field" type="number" id="surfaceHeight" value="3000">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">↔</span> Position X</span>
        <span class="axis-hint">− Left&nbsp;&nbsp;|&nbsp;&nbsp;Right +</span>
      </label>
      <input class="position-field" type="number" step="0.01" id="posX" value="0" title="Move surface left (−) / right (+)">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">↕</span> Position Y</span>
        <span class="axis-hint">− Bottom&nbsp;&nbsp;|&nbsp;&nbsp;Top +</span>
      </label>
      <input class="position-field" type="number" step="0.01" id="posY" value="0" title="Move surface down (−) / up (+)">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">⤢</span> Position Z</span>
        <span class="axis-hint">− Forward&nbsp;&nbsp;|&nbsp;&nbsp;Backward +</span>
      </label>
      <input class="position-field" type="number" step="0.01" id="posZ" value="0" title="Move surface away from you (−) / toward you (+)">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">⮃</span> Rotation X</span>
        <span class="axis-hint">Tilt Up / Down</span>
      </label>
      <input class="rotation-field" type="number" step="0.001" id="rotX" value="0" title="Tilt surface up/down — radians: 1.571 = 90°, 3.142 = 180°">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">⮂</span> Rotation Y</span>
        <span class="axis-hint">Turn Left / Right</span>
      </label>
      <input class="rotation-field" type="number" step="0.001" id="rotY" value="0" title="Turn surface left/right — radians: 1.571 = 90°, 3.142 = 180°">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">↻</span> Rotation Z</span>
        <span class="axis-hint">Roll / Spin</span>
      </label>
      <input class="rotation-field" type="number" step="0.001" id="rotZ" value="0" title="Roll surface flat — radians: 1.571 = 90°, 3.142 = 180°">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">⇹</span> Scale X</span>
        <span class="axis-hint">− Narrow&nbsp;&nbsp;|&nbsp;&nbsp;Wide +</span>
      </label>
      <input class="scale-field" type="number" step="0.1" id="scaleX" value="1" title="Stretch width: below 1 = narrower, above 1 = wider">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">⇳</span> Scale Y</span>
        <span class="axis-hint">− Short&nbsp;&nbsp;|&nbsp;&nbsp;Tall +</span>
      </label>
      <input class="scale-field" type="number" step="0.1" id="scaleY" value="1" title="Stretch height: below 1 = shorter, above 1 = taller">
    </div>

    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">⤡</span> Scale Z</span>
        <span class="axis-hint">− Thin&nbsp;&nbsp;|&nbsp;&nbsp;Deep +</span>
      </label>
      <input class="scale-field" type="number" step="0.1" id="scaleZ" value="1" title="Stretch depth: below 1 = thinner, above 1 = deeper">
    </div>

    <!-- Bent surface: curved wall, round column, arch (whole or part) -->
    <div class="group">
      <label class="axis-label">
        <span><span class="axis-icon">⌒</span> Curve (degrees)</span>
        <span class="axis-hint">0 = flat&nbsp;|&nbsp;+ back&nbsp;|&nbsp;− forward</span>
      </label>
      <input type="number" step="1" min="-359" max="359" id="curve" value="0" title="Degrees of arc of the bent part. +: it bends away (round column); −: it comes toward you (curved wall from inside)">
      <input type="range" min="-180" max="180" step="1" id="curveRange" value="0" style="width:100%;">
    </div>
    <div class="group">
      <label class="axis-label"><span>Bend across</span></label>
      <select id="curveAxis" style="width:100%;">
        <option value="width">width (wall, column)</option>
        <option value="height">height (arch, vault)</option>
      </select>
    </div>
    <div class="group">
      <label class="axis-label">
        <span>Bent part %</span>
        <span class="axis-hint" id="bendHint">0 = left&nbsp;|&nbsp;100 = right</span>
      </label>
      <div style="display:flex;gap:6px;align-items:center;">
        <input type="number" min="0" max="100" step="1" id="bendFrom" value="0" title="Where the bend starts (the rest stays flat)">
        <span>–</span>
        <input type="number" min="0" max="100" step="1" id="bendTo" value="100" title="Where the bend ends (the rest stays flat)">
      </div>
      <div id="bendPresets" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">
        <button type="button" data-from="0" data-to="100">Whole</button>
        <button type="button" data-from="0" data-to="50" class="bp-first">Left half</button>
        <button type="button" data-from="50" data-to="100" class="bp-last">Right half</button>
        <button type="button" data-from="0" data-to="25" class="bp-first-edge">Left edge</button>
        <button type="button" data-from="75" data-to="100" class="bp-last-edge">Right edge</button>
      </div>
    </div>
    <!-- Free shape: push points of the surface forward / back -->
    <div class="group">
      <label class="axis-label">
        <span>Free shape points</span>
        <span class="axis-hint">+ forward&nbsp;|&nbsp;− back (metres)</span>
      </label>
      <select id="shapeSize" style="width:100%;">
        <option value="0">off</option>
        <option value="3">3 × 3</option>
        <option value="4">4 × 4</option>
        <option value="5">5 × 5</option>
        <option value="7">7 × 7</option>
      </select>
      <div id="shapeGrid" style="display:grid;gap:2px;margin-top:4px;"></div>
      <div id="shapeTools" style="display:none;gap:6px;align-items:center;margin-top:4px;">
        <label style="font-size:11px;">Step <input type="number" id="shapeStep" value="0.05" step="0.01" min="0.001" style="width:60px;"></label>
        <button type="button" id="shapeFlat">Flat</button>
      </div>
    </div>

    <button id="addSurfaceBtn">
      Add Surface
    </button>

    <button id="deleteBtn">
      Delete Active Surface
    </button>

    <button id="copyBtn">
      Copy JSON
    </button>
    <button id="saveCoordinateBtn">
      Save Coordinate
    </button>
    <div id="surfaceList"></div>

    <div id="jsonOutput"></div>

  </div>

</div>

<script src="jquery-3.6.0.min.js"></script>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>

<script>

const viewer =
  document.getElementById('viewer');

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0xffffff);

const camera =
  new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

camera.position.set(0,0,0.1);

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(
  window.devicePixelRatio
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

viewer.appendChild(
  renderer.domElement
);

const controls =
  new THREE.OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableZoom = false;
controls.enablePan = false;
controls.rotateSpeed = -0.5;
controls.enableDamping = true;

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    0.7
  )
);

const light =
  new THREE.DirectionalLight(
    0xffffff,
    1
  );

light.position.set(10,10,10);

scene.add(light);

// ── SURFACE SHAPE ─────────────────────────────
// Same code as the user panel 360 render (shared/curved-plane.ts:
// surfaceDeformer + shapeGroup): bent (whole or part) and / or free shape.
function clampN(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function freeShape(shape){
  const cols = Math.round(Number(shape && shape.cols));
  const rows = Math.round(Number(shape && shape.rows));
  const depth = shape && shape.depth;
  if(!(cols >= 2 && cols <= 9 && rows >= 2 && rows <= 9)) return null;
  if(!Array.isArray(depth) || depth.length !== cols * rows) return null;
  const values = depth.map(d => Number(d) || 0);
  return values.some(d => d !== 0) ? { cols, rows, depth: values } : null;
}
function spline(p0, p1, p2, p3, t){
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t
    + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
}
function depthAt(shape, u, v){
  const cols = shape.cols, rows = shape.rows, depth = shape.depth;
  const at = (r, c) => depth[clampN(r, 0, rows - 1) * cols + clampN(c, 0, cols - 1)];
  const fx = clampN(u, 0, 1) * (cols - 1), fy = clampN(v, 0, 1) * (rows - 1);
  const c = Math.min(cols - 2, Math.floor(fx)), r = Math.min(rows - 2, Math.floor(fy));
  const tx = fx - c, ty = fy - r;
  const row = rr => spline(at(rr, c - 1), at(rr, c), at(rr, c + 1), at(rr, c + 2), tx);
  return spline(row(r - 1), row(r), row(r + 1), row(r + 2), ty);
}
function surfaceDeformer(width, height, opts){
  opts = opts || {};
  const deg = clampN(Number(opts.curve) || 0, -359, 359);
  const alongWidth = opts.curveAxis !== 'height';
  let from = clampN(Number(opts.bendFrom == null ? 0 : opts.bendFrom) || 0, 0, 1);
  let to = clampN(Number(opts.bendTo == null ? 1 : opts.bendTo), 0, 1);
  if(Number.isNaN(to)) to = 1;
  if(to < from){ const t = from; from = to; to = t; }
  const bent = Math.abs(deg) >= 0.01 && to - from > 0.001;
  const shape = freeShape(opts.shape);
  if(!(width > 0 && height > 0) || (!bent && !shape)) return null;
  const length = alongWidth ? width : height;
  let along = bent ? clampN(Math.ceil(Math.abs(deg) / 2 / (to - from)), 8, 400) : 1;
  let across = 1;
  if(shape){ along = Math.max(along, 48); across = 48; }
  let path = [];
  const STEPS = 2000;
  if(bent){
    const theta = Math.abs(deg) * Math.PI / 180, sign = deg > 0 ? 1 : -1;
    const part = s => clampN((s / length - from) / (to - from), 0, 1);
    const mid = part(length / 2);
    const heading = s => sign * theta * (part(s) - mid);
    const ds = length / STEPS;
    path = [{ a: 0, z: 0 }];
    for(let k = 0; k < STEPS; k++){
      const h0 = heading(k * ds), h1 = heading((k + 1) * ds), dh = h1 - h0;
      const chord = Math.abs(dh) > 1e-9 ? ds * Math.sin(dh / 2) / (dh / 2) : ds;
      const hm = (h0 + h1) / 2;
      path.push({ a: path[k].a + chord * Math.cos(hm), z: path[k].z - chord * Math.sin(hm) });
    }
    const m = path[STEPS / 2];
    path = path.map(p => ({ a: p.a - m.a, z: p.z - m.z }));
  }
  const pathAt = s => {
    const f = clampN(s / length, 0, 1) * STEPS;
    const k = Math.min(STEPS - 1, Math.floor(f)), t = f - k;
    return { a: path[k].a + (path[k + 1].a - path[k].a) * t, z: path[k].z + (path[k + 1].z - path[k].z) * t };
  };
  const map = (x, y) => {
    let nx = x, ny = y, z = 0;
    if(bent){
      const p = pathAt((alongWidth ? x : y) + length / 2);
      if(alongWidth) nx = p.a; else ny = p.a;
      z = p.z;
    }
    if(shape) z += depthAt(shape, x / width + 0.5, 0.5 - y / height);
    return [nx, ny, z];
  };
  const piece = Math.min((alongWidth ? width : height) / along, (alongWidth ? height : width) / across);
  return { map, piece, alongWidth, along, across };
}
function subdivide(geo, maxEdge){
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  const outPos = [], outUv = [];
  const P = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
  const U = [new THREE.Vector2(), new THREE.Vector2(), new THREE.Vector2()];
  for(let t = 0; t < pos.count; t += 3){
    for(let k = 0; k < 3; k++){
      P[k].fromBufferAttribute(pos, t + k);
      if(uv) U[k].fromBufferAttribute(uv, t + k);
    }
    const longest = Math.max(P[0].distanceTo(P[1]), P[1].distanceTo(P[2]), P[2].distanceTo(P[0]));
    const n = clampN(Math.ceil(longest / maxEdge), 1, 64);
    const point = (i, j) => {
      const a = 1 - (i + j) / n, b = i / n, c = j / n;
      outPos.push(P[0].x * a + P[1].x * b + P[2].x * c, P[0].y * a + P[1].y * b + P[2].y * c, P[0].z * a + P[1].z * b + P[2].z * c);
      if(uv) outUv.push(U[0].x * a + U[1].x * b + U[2].x * c, U[0].y * a + U[1].y * b + U[2].y * c);
    };
    for(let j = 0; j < n; j++){
      for(let i = 0; i < n - j; i++){
        point(i, j); point(i + 1, j); point(i, j + 1);
        if(i + j < n - 1){ point(i + 1, j); point(i + 1, j + 1); point(i, j + 1); }
      }
    }
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(outPos, 3));
  if(uv) out.setAttribute('uv', new THREE.Float32BufferAttribute(outUv, 2));
  return out;
}
function shapeGroup(group, d){
  const e = d.piece * 0.25;
  const normalAt = (x, y) => {
    const p0 = d.map(x, y), p1 = d.map(x + e, y), p2 = d.map(x, y + e);
    return new THREE.Vector3(p1[0] - p0[0], p1[1] - p0[1], p1[2] - p0[2])
      .cross(new THREE.Vector3(p2[0] - p0[0], p2[1] - p0[1], p2[2] - p0[2])).normalize();
  };
  const meshes = group.children.filter(o => o.isMesh);
  meshes.forEach(mesh => {
    const src = mesh.geometry;
    let geo = src.index ? src.toNonIndexed() : src.clone();
    mesh.updateMatrix();
    geo.applyMatrix4(mesh.matrix);
    geo = subdivide(geo, d.piece);
    const pos = geo.attributes.position;
    for(let i = 0; i < pos.count; i++){
      const x = pos.getX(i), y = pos.getY(i), off = pos.getZ(i);
      const p = d.map(x, y);
      if(off){
        const n = normalAt(x, y);
        pos.setXYZ(i, p[0] + n.x * off, p[1] + n.y * off, p[2] + n.z * off);
      }else{
        pos.setXYZ(i, p[0], p[1], p[2]);
      }
    }
    geo.computeVertexNormals();
    mesh.geometry = geo;
    mesh.position.set(0, 0, 0);
    mesh.rotation.set(0, 0, 0);
    mesh.scale.set(1, 1, 1);
  });
}

// Free-shape points of the surface being edited (null = off)
let currentShape = null;
function readSurfaceShape(){
  const to = parseFloat($('#bendTo').val());
  return {
    curve: clampN(Number($('#curve').val()) || 0, -359, 359),
    curveAxis: $('#curveAxis').val() === 'height' ? 'height' : 'width',
    bendFrom: clampN((Number($('#bendFrom').val()) || 0) / 100, 0, 1),
    bendTo: clampN(Number.isFinite(to) ? to / 100 : 1, 0, 1),
    shape: currentShape ? { cols: currentShape.cols, rows: currentShape.rows, depth: currentShape.depth.slice() } : null
  };
}
function writeSurfaceShape(opts){
  opts = opts || {};
  $('#curve').val(Number(opts.curve) || 0);
  $('#curveRange').val(clampN(Number(opts.curve) || 0, -180, 180));
  $('#curveAxis').val(opts.curveAxis === 'height' ? 'height' : 'width');
  $('#bendFrom').val(Math.round((opts.bendFrom == null ? 0 : opts.bendFrom) * 100));
  $('#bendTo').val(Math.round((opts.bendTo == null ? 1 : opts.bendTo) * 100));
  currentShape = opts.shape && opts.shape.depth
    ? { cols: opts.shape.cols, rows: opts.shape.rows, depth: opts.shape.depth.slice() } : null;
  $('#shapeSize').val(currentShape ? String(currentShape.cols) : '0');
  updateBendLabels();
  drawShapeGrid();
}
function updateBendLabels(){
  const h = $('#curveAxis').val() === 'height';
  $('#bendHint').html(h ? '0 = bottom&nbsp;|&nbsp;100 = top' : '0 = left&nbsp;|&nbsp;100 = right');
  $('#bendPresets .bp-first').text(h ? 'Bottom half' : 'Left half');
  $('#bendPresets .bp-last').text(h ? 'Top half' : 'Right half');
  $('#bendPresets .bp-first-edge').text(h ? 'Bottom edge' : 'Left edge');
  $('#bendPresets .bp-last-edge').text(h ? 'Top edge' : 'Right edge');
}
// The points as boxes laid out like the surface (top row first)
function drawShapeGrid(){
  const grid = document.getElementById('shapeGrid');
  grid.innerHTML = '';
  $('#shapeTools').css('display', currentShape ? 'flex' : 'none');
  if(!currentShape) return;
  grid.style.gridTemplateColumns = 'repeat(' + currentShape.cols + ', 1fr)';
  currentShape.depth.forEach((d, k) => {
    const box = document.createElement('input');
    box.type = 'number';
    box.value = d;
    box.step = $('#shapeStep').val() || '0.05';
    box.title = 'Row ' + (Math.floor(k / currentShape.cols) + 1) + ', point ' + (k % currentShape.cols + 1) + ' (+ forward, − back)';
    box.style.cssText = 'width:100%;min-width:0;padding:2px;font-size:11px;text-align:center;';
    const paint = () => { const v = Number(box.value) || 0; box.style.background = v > 0 ? '#ffe9d9' : v < 0 ? '#dfeaff' : '#fff'; };
    paint();
    box.addEventListener('input', () => {
      currentShape.depth[k] = Number(box.value) || 0;
      paint();
      rebuildActiveSurface();
    });
    grid.appendChild(box);
  });
}

let cubeMesh = null;
let currentItemId = '';

let surfaces = [];

let activeSurfaceIndex = -1;

function createCubeEnvironment(url){

  const image = new Image();
  image.crossOrigin = "anonymous";
  image.onload = ()=>{
    
    const faceSize = image.height;

    const faceMap = [

      { x: 0, y: 0 },
      { x: faceSize, y: 0 },
      { x: faceSize * 2, y: 0 },
      { x: faceSize * 3, y: 0 },
      { x: faceSize * 4, y: 0 },
      { x: faceSize * 5, y: 0 },

    ];

    const textures = [];

    for(let i=0;i<6;i++){

      const canvas =
        document.createElement('canvas');

      canvas.width = faceSize;
      canvas.height = faceSize;

      const ctx =
        canvas.getContext('2d');

      ctx.drawImage(
        image,
        faceMap[i].x,
        faceMap[i].y,
        faceSize,
        faceSize,
        0,
        0,
        faceSize,
        faceSize
      );

      const texture =
        new THREE.CanvasTexture(canvas);

      textures.push(texture);
    }

    if(cubeMesh){
      scene.remove(cubeMesh);
    }

    cubeMesh =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          20,
          20,
          20
        ),

        textures.map((tex)=>{

          return new THREE.MeshBasicMaterial({
            map:tex,
            side:THREE.BackSide,
            transparent:true,
            opacity:Number($('#cubeOpacity').val())
          });

        })

      );

    cubeMesh.scale.x = -1;

    scene.add(cubeMesh);
  };

  image.src = url;
}
let surfaceColorIndex = 0;
const surfaceColors = [

  // 0xff0000,
  0x00ff00,
  0x0000ff,
  0xff00ff,
  0x00ffff,
  0xff8800,
  0x888888

];
function createWall(){
  const surfaceColor =
  surfaceColors[
    surfaceColorIndex %
    surfaceColors.length
  ];
  surfaceColorIndex++;
  const surfaceType =
    $('#surfaceType').val();

  const surfaceWidth =
    Number($('#surfaceWidth').val());

  const surfaceHeight =
    Number($('#surfaceHeight').val());

  const tileWidth =
    Number($('#tileWidth').val());

  const tileHeight =
    Number($('#tileHeight').val());

  const groutSize =
    Number($('#groutSize').val());

  const WORLD_SCALE = 0.001;

  const sceneWidth =
    surfaceWidth * WORLD_SCALE;

  const sceneHeight =
    surfaceHeight * WORLD_SCALE;

  const tileWidth3D =
    tileWidth * WORLD_SCALE;

  const tileHeight3D =
    tileHeight * WORLD_SCALE;

  const tileCountX =
    Math.ceil(surfaceWidth / tileWidth);

  const tileCountY =
    Math.ceil(surfaceHeight / tileHeight);

  const tileGrid =
    new THREE.Group();

  tileGrid.userData = {
    type:surfaceType,
    originalColor:surfaceColor,
    width:surfaceWidth,
    height:surfaceHeight,
    tileWidth:tileWidth,
    tileHeight:tileHeight,
    groutSize:groutSize,
    ...readSurfaceShape()
  };
  const deformer = surfaceDeformer(sceneWidth, sceneHeight, tileGrid.userData);

  const groutPlane =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        sceneWidth,
        sceneHeight
      ),

      new THREE.MeshBasicMaterial({
        color:0x222222, //background base (grout also called)
        transparent:true,
        opacity:0.35,
        side:THREE.DoubleSide
      })

    );

  groutPlane.position.z = -0.0025;

  tileGrid.add(groutPlane);

  const outline =
    new THREE.LineSegments(

      new THREE.EdgesGeometry(
        groutPlane.geometry
      ),

      new THREE.LineBasicMaterial({
        color:0x111111
      })

    );
  outline.scale.set(1.02, 1.02, 1.02);
  // a straight outline would not follow a bent / shaped surface
  if(!deformer) tileGrid.add(outline);

  const halfW = sceneWidth  / 2;
  const halfH = sceneHeight / 2;

  for(let row=0; row<tileCountY; row++){

    for(let col=0; col<tileCountX; col++){

      // Tile bounds in local scene space
      const tileLeft   = col * (tileWidth3D  + groutSize) - halfW;
      const tileRight  = tileLeft   + tileWidth3D;
      const tileBottom = row * (tileHeight3D + groutSize) - halfH;
      const tileTop    = tileBottom + tileHeight3D;

      // Clip to surface boundary
      const visLeft   = Math.max(tileLeft,   -halfW);
      const visRight  = Math.min(tileRight,   halfW);
      const visBottom = Math.max(tileBottom, -halfH);
      const visTop    = Math.min(tileTop,     halfH);

      if(visRight - visLeft < 0.0001 || visTop - visBottom < 0.0001) continue;

      const tile =
        new THREE.Mesh(

          new THREE.PlaneGeometry(
            visRight - visLeft,
            visTop   - visBottom
          ),

          new THREE.MeshBasicMaterial({
            color:surfaceColor,
            transparent:true,
            opacity:0.9,
            side:THREE.DoubleSide
          })

        );

      tile.position.x = (visLeft   + visRight)  / 2;
      tile.position.y = (visBottom + visTop) / 2;

      tileGrid.add(tile);
    }
  }

  if(deformer) shapeGroup(tileGrid, deformer);

  if(surfaceType === 'floor'){

    tileGrid.rotation.x =
      -Math.PI / 2;
  }

  scene.add(tileGrid);

  surfaces.push(tileGrid);

  activeSurfaceIndex =
    surfaces.length - 1;

  refreshSurfaceList();

  updateWall();
}

function updateWall(){

  if(activeSurfaceIndex === -1)
    return;

  const wallMesh =
    surfaces[activeSurfaceIndex];

  wallMesh.position.set(

    Number($('#posX').val()),
    Number($('#posY').val()),
    Number($('#posZ').val())

  );

  wallMesh.rotation.set(

    Number($('#rotX').val()),
    Number($('#rotY').val()),
    Number($('#rotZ').val())

  );

  wallMesh.scale.set(

    Number($('#scaleX').val()),
    Number($('#scaleY').val()),
    Number($('#scaleZ').val())

  );

  updateJSON();
}

function loadSurfaceValues(){

  if(activeSurfaceIndex === -1)
    return;

  const wallMesh =
    surfaces[activeSurfaceIndex];
  wallMesh.traverse((child)=>{
    if(child.material){
      child.material.color.set(
        0xff0000
      );
    }
  });
  $('#posX').val(wallMesh.position.x);
  $('#posY').val(wallMesh.position.y);
  $('#posZ').val(wallMesh.position.z);

  $('#rotX').val(wallMesh.rotation.x);
  $('#rotY').val(wallMesh.rotation.y);
  $('#rotZ').val(wallMesh.rotation.z);

  $('#scaleX').val(wallMesh.scale.x);
  $('#scaleY').val(wallMesh.scale.y);
  $('#scaleZ').val(wallMesh.scale.z);
  $('#surfaceWidth').val(
    wallMesh.userData.width
  );

  $('#surfaceHeight').val(
    wallMesh.userData.height
  );

  $('#tileWidth').val(
    wallMesh.userData.tileWidth
  );

  $('#tileHeight').val(
    wallMesh.userData.tileHeight
  );

  $('#groutSize').val(
    wallMesh.userData.groutSize
  );

  $('#surfaceType').val(
    wallMesh.userData.type
  );
  writeSurfaceShape(wallMesh.userData);
  updateJSON();
}

function refreshSurfaceList(){

  $('#surfaceList').html('');

  surfaces.forEach((surface,index)=>{

    const div =
      $(`
        <div
          class="surface-item ${index === activeSurfaceIndex ? 'active' : ''}"
        >
          Surface ${index + 1}
          (${surface.userData.type})
        </div>
      `);

    div.on('click',function(){

      updateColorBeforeChnage(activeSurfaceIndex);

      activeSurfaceIndex = index;

      refreshSurfaceList();

      loadSurfaceValues();
    });

    $('#surfaceList').append(div);
  });
}
function updateColorBeforeChnage(activeSurfaceIndex){

  if(activeSurfaceIndex === -1)
    return;

  const wallMesh =
    surfaces[activeSurfaceIndex];

  const originalColor =
    wallMesh.userData.originalColor;

  wallMesh.traverse((child)=>{

    if(child.material){

      child.material.color.set(
        originalColor
      );

    }

  });

}
function deleteSurface(){

  if(activeSurfaceIndex === -1)
    return;

  scene.remove(
    surfaces[activeSurfaceIndex]
  );

  surfaces.splice(
    activeSurfaceIndex,
    1
  );

  if(surfaces.length){

    activeSurfaceIndex = 0;

  }else{

    activeSurfaceIndex = -1;
  }

  refreshSurfaceList();

  loadSurfaceValues();
}

function updateJSON(){

  const roomData =
    surfaces.map((surface)=>{

      return {

        isWall:
          surface.userData.type === 'wall',

        roomCoordinate:[

          {

            position:{
              x:surface.position.x,
              y:surface.position.y,
              z:surface.position.z
            },

            rotation:{
              x:surface.rotation.x,
              y:surface.rotation.y,
              z:surface.rotation.z
            },

            scale:{
              x:surface.scale.x,
              y:surface.scale.y,
              z:surface.scale.z
            },

            width:
              surface.userData.width,

            height:
              surface.userData.height,

            tileWidth:
              surface.userData.tileWidth,

            tileHeight:
              surface.userData.tileHeight,

            groutSize:
              surface.userData.groutSize,

            curve: surface.userData.curve || 0,
            curveAxis: surface.userData.curveAxis || 'width',
            bendFrom: surface.userData.bendFrom == null ? 0 : surface.userData.bendFrom,
            bendTo: surface.userData.bendTo == null ? 1 : surface.userData.bendTo,
            shape: freeShape(surface.userData.shape)

          }

        ]

      };

    });

  $('#jsonOutput').text(
    JSON.stringify(
      roomData,
      null,
      2
    )
  );

}

function updateCubeOpacity(){

  if(!cubeMesh)
    return;

  cubeMesh.material.forEach((mat)=>{

    mat.opacity =
      Number($('#cubeOpacity').val());

  });
}
function getStepValue(){

  return Number(
    $('#decimalPrecision').val()
  );
}

function updateInputSteps(){

  const step = getStepValue();

  $('#posX, #posY, #posZ').attr(
    'step',
    step
  );

  $('#rotX, #rotY, #rotZ').attr(
    'step',
    step
  );

  $('#scaleX, #scaleY, #scaleZ').attr(
    'step',
    step
  );
}
function animate(){

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene,camera);
}
updateInputSteps();
animate();
$('#decimalPrecision').on(
  'change',
  function(){

    updateInputSteps();

  }
);
$('#cubeUpload').on(
  'change',
  function(e){

    const file =
      e.target.files[0];

    if(!file) return;

    $('#nameImage').text(file.name);

    createCubeEnvironment(
      URL.createObjectURL(file)
    );
  }
);

$('#cubeOpacity').on(
  'input',
  updateCubeOpacity
);

$('#addSurfaceBtn').on(
  'click',
  function(){
    // a new surface starts flat
    writeSurfaceShape({});
    createWall();
  }
);

$('#deleteBtn').on(
  'click',
  deleteSurface
);

$('#copyBtn').on(
  'click',
  function(){

    navigator.clipboard.writeText(
      $('#jsonOutput').text()
    );

    alert('Copied');
  }
);
$('#saveCoordinateBtn').on(
  'click',
  function(){

    const isConfirm =
      confirm(
        'Are you sure you want to save coordinates?'
      );

    if(!isConfirm){
      return;
    }

    const roomData =
      JSON.parse(
        $('#jsonOutput').text()
      );

    window.opener.postMessage({

      type:'SAVE_ROOM_DATA',

      roomData:roomData,

      itemId:currentItemId

    }, 'https://admin.wolfynext.com');

    alert('Coordinate Saved');

  }
);
$('#posX,#posY,#posZ,\
#rotX,#rotY,#rotZ,\
#scaleX,#scaleY,#scaleZ')
.on('input',function(){

  updateWall();
});
// Rebuild the active surface (shape / size changed), keeping where it is
function rebuildActiveSurface(){
  $('#surfaceWidth').trigger('change');
}
$('#curve').on('input', function(){
  $('#curveRange').val(clampN(Number($(this).val()) || 0, -180, 180));
  rebuildActiveSurface();
});
$('#curveRange').on('input', function(){
  $('#curve').val($(this).val());
  rebuildActiveSurface();
});
$('#curveAxis').on('change', function(){ updateBendLabels(); rebuildActiveSurface(); });
$('#bendFrom,#bendTo').on('input', rebuildActiveSurface);
$('#bendPresets button').on('click', function(){
  $('#bendFrom').val($(this).data('from'));
  $('#bendTo').val($(this).data('to'));
  rebuildActiveSurface();
});
$('#shapeSize').on('change', function(){
  const n = parseInt($(this).val()) || 0;
  currentShape = n ? { cols: n, rows: n, depth: new Array(n * n).fill(0) } : null;
  drawShapeGrid();
  rebuildActiveSurface();
});
$('#shapeStep').on('change', drawShapeGrid);
$('#shapeFlat').on('click', function(){
  if(!currentShape) return;
  currentShape.depth = currentShape.depth.map(() => 0);
  drawShapeGrid();
  rebuildActiveSurface();
});
$('#surfaceWidth,\
#surfaceHeight,\
#tileWidth,\
#tileHeight,\
#groutSize,\
#surfaceType')
.on('change',function(){

  if(activeSurfaceIndex === -1)
    return;

  const oldSurface =
    surfaces[activeSurfaceIndex];

  const oldPosition =
    oldSurface.position.clone();

  const oldRotation =
    oldSurface.rotation.clone();

  const oldScale =
    oldSurface.scale.clone();

  scene.remove(oldSurface);

  surfaces.splice(
    activeSurfaceIndex,
    1
  );
  createWall();
  const newSurface =
    surfaces[activeSurfaceIndex];

  newSurface.position.copy(
    oldPosition
  );

  newSurface.rotation.copy(
    oldRotation
  );

  newSurface.scale.copy(
    oldScale
  );

  updateJSON();
});
function loadRoomData(roomData){

  surfaces.forEach((surface)=>{
    scene.remove(surface);
  });

  surfaces = [];

  if(!roomData)
    return;

  roomData.forEach((room)=>{

    room.roomCoordinate.forEach((coord)=>{

      $('#surfaceType').val(
        room.isWall ? 'wall' : 'floor'
      );

      $('#surfaceWidth').val(
        coord.width || 4600
      );

      $('#surfaceHeight').val(
        coord.height || 3000
      );

      $('#tileWidth').val(
        coord.tileWidth || 1200
      );

      $('#tileHeight').val(
        coord.tileHeight || 600
      );

      $('#groutSize').val(
        coord.groutSize || 0.01
      );

      writeSurfaceShape(coord);

      createWall();

      const wall =
        surfaces[
          surfaces.length - 1
        ];

      wall.position.set(
        coord.position.x,
        coord.position.y,
        coord.position.z
      );

      wall.rotation.set(
        coord.rotation.x,
        coord.rotation.y,
        coord.rotation.z
      );

      wall.scale.set(
        coord.scale.x,
        coord.scale.y,
        coord.scale.z
      );

    });

  });

  activeSurfaceIndex = 0;

  refreshSurfaceList();

  loadSurfaceValues();

  updateJSON();

}

window.addEventListener(
  'message',
  function(event){

    const message =
      event.data;

    if(
      message.type ===
      'LOAD_360_DATA'
    ){

      const data =
        message.data;

      currentItemId =
        data._id;

      console.log(data);

      if(data.File){

        createCubeEnvironment(
          data.File
        );

      }

      if(data.RoomData){

        loadRoomData(
          data.RoomData
        );

      }

    }

  }
);
window.addEventListener(
  'resize',
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

</script>
