<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spline → Three.js Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
  font-family: Arial;
  background:#f5f5f5;
  padding:20px;
}
.container {
  display:flex;
  gap:40px;
}
.box {
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
}
input {
  width:70px;
  margin:5px;
}
h3 {
  margin-top:0;
}
pre {
  background:#222;
  color:#0f0;
  padding:10px;
}
</style>

</head>

<body>

<h2>Spline → Three.js Converter</h2>

<div class="container">

  <!-- INPUT -->

  <div class="box">
    <h3>Spline Input</h3>

```
<b>Position</b><br>
X <input id="px" type="number" value="0"><br>
Y <input id="py" type="number" value="0"><br>
Z <input id="pz" type="number" value="0"><br>

<b>Rotation (degrees)</b><br>
X <input id="rx" type="number" value="0"><br>
Y <input id="ry" type="number" value="0"><br>
Z <input id="rz" type="number" value="0"><br>

<b>Scale</b><br>
X <input id="sx" type="number" value="1"><br>
Y <input id="sy" type="number" value="1"><br>
Z <input id="sz" type="number" value="1"><br>

<button onclick="convert()">Convert</button>
```

  </div>

  <!-- OUTPUT -->

  <div class="box">
    <h3>Three.js Output</h3>
    <pre id="output"></pre>
  </div>

</div>

<script>

function degToRad(d) {
  return d * Math.PI / 180;
}

function convert() {

  // get input
  const px = parseFloat(document.getElementById('px').value);
  const py = parseFloat(document.getElementById('py').value);
  const pz = parseFloat(document.getElementById('pz').value);

  const rx = parseFloat(document.getElementById('rx').value);
  const ry = parseFloat(document.getElementById('ry').value);
  const rz = parseFloat(document.getElementById('rz').value);

  const sx = parseFloat(document.getElementById('sx').value);
  const sy = parseFloat(document.getElementById('sy').value);
  const sz = parseFloat(document.getElementById('sz').value);

  // 🔥 convert rotation using quaternion (best way)
  const euler = new THREE.Euler(
    degToRad(rx),
    degToRad(ry),
    degToRad(rz),
    'XYZ'
  );

  const q = new THREE.Quaternion();
  q.setFromEuler(euler);

  // 🔥 axis fix (important)
  const fix = new THREE.Quaternion();
  fix.setFromEuler(new THREE.Euler(0, Math.PI, 0));
  q.multiply(fix);

  const finalEuler = new THREE.Euler().setFromQuaternion(q, 'XYZ');

  // output
  const result = {
    position: {
      x: px,
      y: py,
      z: pz
    },
    rotation: {
      x: +finalEuler.x.toFixed(4),
      y: +finalEuler.y.toFixed(4),
      z: +finalEuler.z.toFixed(4)
    },
    scale: {
      x: sx,
      y: sy,
      z: sz
    }
  };

  document.getElementById('output').innerText = JSON.stringify(result, null, 2);
}

</script>

</body>
</html>
